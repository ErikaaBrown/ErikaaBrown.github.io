<script src="js/app.js?v=8"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CATS = ["test_results", "mood", "thoughts", "gratitude", "habits", "sleep", "worries",
    "copingcards", "achievements", "compassionbreak", "fears", "values"];
  var ARRAY_CATS = ["habits", "thoughts", "worries", "copingcards", "achievements", "compassionbreak", "fears", "values", "test_results"];
  var selected = PL.load("ficha", []);
  var connections = [];

  function previewFor(cat) {
    if (cat === "test_results") {
      var n = PL.load("test_results", []).length;
      if (!n) return PL.t("preview.empty");
      return n + (n === 1 ? PL.t("preview.testcount.1") : PL.t("preview.testcount.n"));
    }
    var def = ARRAY_CATS.indexOf(cat) >= 0 ? [] : {};
    var data = PL.load(cat, def);
    var fmt = PL.formatters[cat];
    var html = fmt ? fmt(data) : "";
    return html || PL.t("preview.empty");
  }

  function renderChecklist() {
    var box = $("cat-list");
    box.innerHTML = "";
    CATS.forEach(function (cat) {
      var checked = selected.indexOf(cat) >= 0;
      var row = document.createElement("div");
      row.className = "panel " + (checked ? "ficha-row-on" : "ficha-row-off");
      var head = document.createElement("button");
      head.className = "tag-btn" + (checked ? " sel" : "");
      head.style.cssText = "width:100%;text-align:left";
      head.textContent = (PL.catIcons[cat] || "") + " " + PL.t("cat." + cat);
      head.addEventListener("click", function () {
        var p = selected.indexOf(cat);
        if (p >= 0) selected.splice(p, 1); else selected.push(cat);
        PL.store("ficha", selected);
        renderChecklist();
      });
      row.appendChild(head);
      if (checked) {
        var prev = document.createElement("div");
        prev.className = "small muted interp";
        prev.style.marginTop = "10px";
        prev.innerHTML = previewFor(cat);
        row.appendChild(prev);
      }
      box.appendChild(row);
    });
    $("print-meta").textContent = PL.t("print.meta") + PL.fmtDate(PL.todayISO());
  }

  $("btn-print").addEventListener("click", function () { window.print(); });

  function loadShareSection() {
    if (!window.PLSync || !PLSync.user()) {
      $("share-noaccount").classList.remove("hidden");
      $("share-empty").classList.add("hidden");
      $("share-picker").classList.add("hidden");
      return;
    }
    $("share-noaccount").classList.add("hidden");
    PLSync.listConnections().then(function (r) {
      connections = r.asPatient || [];
      if (!connections.length) {
        $("share-empty").classList.remove("hidden");
        $("share-picker").classList.add("hidden");
        return;
      }
      $("share-empty").classList.add("hidden");
      $("share-picker").classList.remove("hidden");
      var sel = $("conn-select");
      sel.innerHTML = "";
      connections.forEach(function (conn) {
        var opt = document.createElement("option");
        opt.value = conn.connectionId;
        opt.textContent = conn.otherDisplayName || conn.otherEmail;
        sel.appendChild(opt);
      });
    });
  }

  $("btn-share").addEventListener("click", function () {
    var connectionId = parseInt($("conn-select").value, 10);
    var conn = connections.filter(function (c) { return c.connectionId === connectionId; })[0];
    if (!conn) return;
    $("btn-share").disabled = true;
    $("share-status").textContent = "";
    var chain = Promise.resolve();
    CATS.forEach(function (cat) {
      var on = selected.indexOf(cat) >= 0;
      chain = chain.then(function () { return PLSync.setShare(connectionId, cat, conn.otherPub, on); });
    });
    chain.then(function () {
      $("btn-share").disabled = false;
      PL.toast(PL.t("share.done"));
    }).catch(function (e) {
      console.error("[ficha] share failed:", e && (e.code || e.message));
      $("btn-share").disabled = false;
      $("share-status").textContent = PL.t("share.err");
    });
  });

  document.addEventListener("pl:ready", renderChecklist);
  document.addEventListener("pl:sync-ready", loadShareSection);
  PL.onLang(function () {
    renderChecklist();
    if (window.PLSync && PLSync.user() && connections.length) {
      var sel = $("conn-select");
      connections.forEach(function (conn, i) { sel.options[i].textContent = conn.otherDisplayName || conn.otherEmail; });
    }
  });
})();
</script>
