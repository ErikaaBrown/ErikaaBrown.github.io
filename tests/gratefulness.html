<body>
<div id="site-header"></div>

<main class="container narrow">
  <div class="page-hero">
    <span class="crumb" data-i18n="crumb"></span>

    <p data-i18n="intro.p1"></p>
    <div class="notice" data-i18n-html="intro.notice"></div>
    <div class="center mt-2">
      <button class="btn" id="btn-start" data-i18n="btn.start"></button>
    </div>
  </section>

  <section id="panel-quiz" class="panel hidden">
    <div class="progress-track"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <p class="small muted" id="qcount"></p>
    <p class="quiz-q" id="qtext"></p>

      <span data-i18n="lk.4"></span>

    <div class="quiz-nav">
      <button class="btn btn-ghost btn-sm" id="btn-back" data-i18n="btn.back"></button>
      <span></span>
    </div>
  </section>

  <section id="panel-result" class="hidden">
    <div class="panel center">
      <h2 style="margin-top:0" data-i18n="res.title"></h2>
      <div class="chart-wrap" id="gauge-wrap" style="max-width:420px;margin:0 auto"></div>
      <p id="badge-line"></p>
      <p id="band-text" class="muted" style="max-width:560px;margin:10px auto 0;text-align:left"></p>
    </div>
    <div class="panel panel-soft">
      <p style="margin:0" data-i18n="res.expl"></p>
    </div>
    <div class="notice" data-i18n-html="res.notice"></div>
    <div class="center mt-2">
      <button class="btn btn-ghost" id="btn-retake" data-i18n="btn.retake"></button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "tests",
  i18n: {
    pt: {
      "page.title": "Gratidão Disposicional",
      "crumb": "Testes",
      "intro.lead": "Há quem repare naturalmente no que tem de bom na vida, e quem precise de treinar esse olhar. Este teste avalia essa tendência geral, não só um momento pontual.",

      "intro.notice": "<strong>Importante:</strong> este questionário é inspirado em investigação sobre gratidão disposicional (um traço relativamente estável). É diferente de sentir gratidão num momento específico. É indicativo e educativo; não substitui uma avaliação profissional.",
      "btn.start": "Começar",
      "btn.back": "← Anterior",
      "btn.retake": "Repetir",
      "lk.1": "Discordo totalmente",
      "lk.4": "Concordo totalmente",
      "res.title": "O teu resultado",
      "res.notice": "<strong>A gratidão treina-se</strong>: mesmo que não seja a tua tendência natural, praticar notar e registar coisas boas, por pequenas que sejam, muda esse padrão ao longo do tempo.",
      "band.low": "Abaixo do intervalo típico. É provável que o teu foco vá naturalmente para o que falta ou corre mal, mais do que para o que já está bem. Registar 3 coisas boas por dia, mesmo pequenas, é um bom ponto de partida.",
      "band.mid": "Dentro do intervalo típico: notas e sentes gratidão em muitos momentos, mas não é um hábito automático. Há sempre espaço para o reforçar.",
      "band.high": "Acima do intervalo típico. Tens uma tendência forte para notar e valorizar o que já tens. É um dos traços mais associados a bem-estar e satisfação com a vida.",
      "lbl.low": "Baixa", "lbl.mid": "Típica", "lbl.high": "Elevada",
      "res.expl": "🌻 O que mede: este questionário é inspirado na investigação sobre gratidão disposicional de McCullough, Emmons e Tsang. Distingue-se da gratidão momentânea (sentida depois de um gesto concreto): aqui mede-se a tendência geral para notar e valorizar o que já se tem. Podes praticá-la no Diário de Gratidão deste site."
    },
    en: {
      "page.title": "Dispositional Gratitude",
      "crumb": "Tests",
      "intro.lead": "Some people naturally notice the good in their lives, others need to train that outlook. This test measures that general tendency, not just a one-off moment.",
      "intro.p1": "You will answer 10 statements about how you tend to feel and notice gratitude day to day. There are no right or wrong answers: indicate how much you agree with each one.",
      "intro.notice": "<strong>Important:</strong> this questionnaire is inspired by research on dispositional gratitude (a relatively stable trait). It differs from feeling grateful in a specific moment. It is indicative and educational; it does not replace a professional assessment.",
      "btn.start": "Start",
      "btn.back": "← Previous",
      "btn.retake": "Retake",

      "res.expl": "🌻 What it measures: this questionnaire is inspired by research on dispositional gratitude by McCullough, Emmons and Tsang. It differs from momentary gratitude (felt right after a concrete gesture): here it measures the general tendency to notice and value what one already has. You can practise it in this site's Gratitude Journal."

<script src="../js/app.js?v=5"></script>
<script>
(function () {
  var ITEMS = [
    { r: false, pt: "Tenho muitas coisas na vida pelas quais sentir gratidão.", en: "I have many things in my life to be grateful for." },
    { r: true,  pt: "Tenho dificuldade em encontrar razões para ser grato/a, mesmo quando penso nisso.", en: "I have trouble finding reasons to be grateful, even when I think about it." },
    { r: false, pt: "Costumo notar e apreciar os pequenos gestos das pessoas à minha volta.", en: "I tend to notice and appreciate the small gestures of people around me." },
    { r: true,  pt: "Dou por garantido grande parte do que tenho.", en: "I take much of what I have for granted." },
    { r: false, pt: "Sinto-me grato/a por uma grande variedade de coisas na minha vida: pessoas, oportunidades, experiências.", en: "I feel grateful for a wide variety of things in my life: people, opportunities, experiences." },
    { r: true,  pt: "Comparo-me com quem tem mais do que eu, mais do que reparo no que já tenho.", en: "I compare myself to people who have more than me, more than I notice what I already have." },
    { r: false, pt: "Quando algo corre bem, paro para reconhecer isso, mesmo que seja pequeno.", en: "When something goes well, I pause to acknowledge it, even if it's small." },
    { r: true,  pt: "Preciso que aconteça algo grande para me sentir agradecido/a.", en: "I need something big to happen to feel grateful." },
    { r: false, pt: "Sinto-me grato/a por pessoas que já não fazem parte da minha vida, pelo que me ensinaram ou trouxeram.", en: "I feel grateful for people no longer in my life, for what they taught me or brought me." },
    { r: false, pt: "No geral, sinto que tenho muito mais motivos para agradecer do que para reclamar.", en: "Overall, I feel I have far more reasons to be thankful than to complain." }
  ];

  var LIKERT = {
    pt: ["Discordo totalmente", "Discordo", "Concordo", "Concordo totalmente"],
    en: ["Strongly disagree", "Disagree", "Agree", "Strongly agree"]
  };

  var BANDS = [
    { max: 14, key: "low",  color: "var(--serious)",  icon: "🌱" },
    { max: 25, key: "mid",  color: "var(--brand)",    icon: "🌻" },
    { max: 30, key: "high", color: "var(--good)",     icon: "✨" }
  ];

  var answers = new Array(ITEMS.length).fill(-1);
  var idx = 0;
  var state = "intro";
  var $ = function (id) { return document.getElementById(id); };

  function show(panel) {
    $("panel-intro").classList.toggle("hidden", panel !== "intro");
    $("panel-quiz").classList.toggle("hidden", panel !== "quiz");
    $("panel-result").classList.toggle("hidden", panel !== "result");
    state = panel;
  }

  function renderQuestion() {
    var item = ITEMS[idx];
    $("qtext").textContent = item[PL.lang];
    $("qcount").textContent = (idx + 1) + " / " + ITEMS.length;
    $("pfill").style.width = (idx / ITEMS.length * 100) + "%";
    var lk = $("likert");
    lk.innerHTML = "";
    LIKERT[PL.lang].forEach(function (label, i) {
      var b = document.createElement("button");
      b.textContent = label;
      if (answers[idx] === i) b.classList.add("sel");
      b.addEventListener("click", function () {
        answers[idx] = i;
        b.classList.add("sel");
        setTimeout(function () {
          if (idx < ITEMS.length - 1) { idx++; renderQuestion(); }
          else { finish(); }
        }, 220);
      });
      lk.appendChild(b);
    });
    $("btn-back").disabled = idx === 0;
  }

  function score() {
    var s = 0;
    ITEMS.forEach(function (item, i) {
      s += item.r ? 3 - answers[i] : answers[i];
    });
    return s;
  }

  function bandOf(s) {
    for (var i = 0; i < BANDS.length; i++) if (s <= BANDS[i].max) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  function gauge(s) {
    var cx = 210, cy = 200, R = 150, W = 26;
    function pol(frac) {
      var a = Math.PI + frac * Math.PI;
      return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
    }
    function arc(f0, f1, color) {
      var p0 = pol(f0), p1 = pol(f1);
      var large = (f1 - f0) > 0.5 ? 1 : 0;
      return "<path d='M" + p0[0] + " " + p0[1] + " A" + R + " " + R + " 0 " + large + " 1 " + p1[0] + " " + p1[1] +
        "' fill='none' style='stroke:" + color + "' stroke-width='" + W + "'/>";
    }
    var gap = 0.008;
    var stops = [0, 14.5 / 30, 25.5 / 30, 1];
    var arcs = "";
    BANDS.forEach(function (b, i) {
      arcs += arc(stops[i] + (i ? gap : 0), stops[i + 1] - (i < BANDS.length - 1 ? gap : 0), b.color);
    });
    var f = Math.max(0.01, Math.min(0.99, s / 30));
    var tip = pol(f);
    var innerR = R - W / 2 - 12;
    var a = Math.PI + f * Math.PI;
    var base = [cx + innerR * Math.cos(a), cy + innerR * Math.sin(a)];
    var needle = "<line x1='" + base[0] + "' y1='" + base[1] + "' x2='" + tip[0] + "' y2='" + tip[1] +
      "' style='stroke:var(--ink)' stroke-width='4' stroke-linecap='round'/>";
    return "<svg viewBox='0 0 420 240' role='img' aria-label='Gauge'>" + arcs + needle +
      "<text x='" + cx + "' y='" + (cy - 30) + "' text-anchor='middle' font-size='52' font-weight='800' style='fill:var(--ink)'>" + s + "</text>" +
      "<text x='" + cx + "' y='" + (cy - 4) + "' text-anchor='middle' font-size='14' style='fill:var(--ink-3)'>/ 30</text>" +
      "<text x='" + (cx - R) + "' y='" + (cy + 26) + "' text-anchor='middle' font-size='12' style='fill:var(--ink-3)'>0</text>" +
      "<text x='" + (cx + R) + "' y='" + (cy + 26) + "' text-anchor='middle' font-size='12' style='fill:var(--ink-3)'>30</text>" +
      "</svg>";
  }

  function renderResult() {
    var s = score();
    var b = bandOf(s);
    $("gauge-wrap").innerHTML = gauge(s);
    $("badge-line").innerHTML = "<span class='status-badge'>" + b.icon + " <span style='color:" + b.color + "'>" + PL.t("lbl." + b.key) + "</span></span>";
    $("band-text").textContent = PL.t("band." + b.key);
  }

  function finish() {
    $("pfill").style.width = "100%";
    PL.saveTestResult("gratefulness", score());
    renderResult();
    show("result");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("btn-start").addEventListener("click", function () {
    answers.fill(-1); idx = 0; show("quiz"); renderQuestion();
  });
  $("btn-back").addEventListener("click", function () {
    if (idx > 0) { idx--; renderQuestion(); }
  });
  $("btn-retake").addEventListener("click", function () {
    answers.fill(-1); idx = 0; show("quiz"); renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  PL.onLang(function () {
    if (state === "quiz") renderQuestion();
    if (state === "result") renderResult();
  });
})();
</script>
</body>
</html>
