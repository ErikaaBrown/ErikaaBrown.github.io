  <section id="panel-result" class="hidden">

      <div class="chart-wrap" id="gauge-wrap" style="max-width:420px;margin:0 auto"></div>
      <p id="badge-line"></p>
      <p id="band-text" class="muted" style="max-width:560px;margin:10px auto 0;text-align:left"></p>
    </div>
    <div class="panel panel-soft">
      <p style="margin:0" data-i18n="res.expl"></p>
    </div>

      <button class="btn btn-ghost" id="btn-retake" data-i18n="btn.retake"></button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "tests",
  i18n: {
    pt: {
      "page.title": "Autocompaixão",
      "crumb": "Testes",
      "intro.lead": "Autocompaixão é a forma como te tratas a ti mesmo/a nos momentos difíceis: com a mesma gentileza que ofereces a um amigo, ou com dureza?",
      "intro.p1": "Vais responder a 12 afirmações sobre como costumas reagir perante erros, dificuldades e sofrimento. Não há respostas certas ou erradas: indica a frequência com que cada uma se aplica a ti.",
      "intro.notice": "<strong>Importante:</strong> este questionário é inspirado no modelo académico de autocompaixão de Kristin Neff (self-kindness, common humanity, mindfulness). É indicativo e educativo; não substitui uma avaliação profissional.",
      "btn.start": "Começar",
      "btn.back": "← Anterior",
      "btn.retake": "Repetir",
      "lk.1": "Quase nunca",
      "lk.4": "Quase sempre",
      "res.title": "O teu resultado",
      "res.notice": "<strong>A autocompaixão treina-se</strong>: não é um traço fixo, é uma forma de reagir que se pratica, como um músculo. Pequenos gestos diários (uma pausa, um tom mais gentil contigo mesmo/a) já fazem diferença.",
      "band.low": "Abaixo do intervalo típico. É provável que tenhas um discurso interno bastante crítico e que te sintas sozinho/a nos momentos difíceis. Vale a pena começar por notar esse discurso, sem te julgares por o teres.",
      "band.mid": "Dentro do intervalo típico: um misto de gentileza e crítica contigo mesmo/a, como a maioria das pessoas. Há sempre espaço para reforçar o lado mais gentil.",
      "band.high": "Acima do intervalo típico. Tendes a tratar-te com gentileza mesmo nos momentos difíceis, e a lembrar-te de que sofrer faz parte da experiência humana partilhada.",
      "lbl.low": "Baixa", "lbl.mid": "Típica", "lbl.high": "Elevada",
      "res.expl": "🤍 O que mede: este questionário avalia três eixos propostos por Kristin Neff (2003): gentileza vs. crítica contigo mesmo/a, sentido de humanidade partilhada vs. isolamento, e atenção equilibrada vs. sobre-identificação com o sofrimento. É um construto distinto da auto-estima: mede como reages ao sofrimento, não o quanto te valorizas."
    },
    en: {
      "page.title": "Self-Compassion",
      "crumb": "Tests",
      "intro.lead": "Self-compassion is how you treat yourself in hard moments: with the same kindness you would offer a friend, or with harshness?",
      "intro.p1": "You will answer 12 statements about how you tend to react to mistakes, difficulties and suffering. There are no right or wrong answers: indicate how often each one applies to you.",
      "intro.notice": "<strong>Important:</strong> this questionnaire is inspired by Kristin Neff's academic model of self-compassion (self-kindness, common humanity, mindfulness). It is indicative and educational; it does not replace a professional assessment.",
      "btn.start": "Start",
      "btn.back": "← Previous",
      "btn.retake": "Retake",
      "lk.1": "Almost never",
      "lk.4": "Almost always",

      "res.notice": "<strong>Self-compassion can be trained</strong>: it is not a fixed trait, it is a way of responding that you practise, like a muscle. Small daily gestures (a pause, a gentler tone with yourself) already make a difference.",
      "band.low": "Below the typical range. You likely have a fairly critical inner voice and tend to feel alone in hard moments. It is worth starting by simply noticing that voice, without judging yourself for having it.",
      "band.mid": "Within the typical range: a mix of kindness and criticism toward yourself, like most people. There is always room to build up the kinder side.",
      "band.high": "Above the typical range. You tend to treat yourself with kindness even in hard moments, and to remember that suffering is part of the shared human experience.",
      "lbl.low": "Low", "lbl.mid": "Typical", "lbl.high": "High",
      "res.expl": "🤍 What it measures: this questionnaire assesses three axes proposed by Kristin Neff (2003): kindness vs. self-judgement, common humanity vs. isolation, and balanced awareness vs. over-identification with suffering. It is a distinct construct from self-esteem: it measures how you respond to suffering, not how much you value yourself."
    }

<script src="../js/app.js?v=7"></script>
<script>
(function () {
  var ITEMS = [
    { r: false, pt: "Quando falho em algo importante, tento ser compreensivo/a comigo mesmo/a.", en: "When I fail at something important, I try to be understanding with myself." },
    { r: true,  pt: "Sou bastante crítico/a e duro/a comigo mesmo/a quando cometo erros.", en: "I am quite critical and hard on myself when I make mistakes." },
    { r: false, pt: "Vejo os meus momentos difíceis como parte de uma experiência que toda a gente atravessa, de uma forma ou de outra.", en: "I see my hard moments as part of an experience that everyone goes through, in one way or another." },
    { r: true,  pt: "Quando sofro, sinto-me isolado/a do resto do mundo, como se só a mim isto acontecesse.", en: "When I suffer, I feel isolated from the rest of the world, as if this only happens to me." },
    { r: false, pt: "Quando algo me perturba, tento olhar para a situação com alguma distância, sem me deixar arrastar.", en: "When something upsets me, I try to look at the situation with some distance, without getting swept away." },
    { r: true,  pt: "Quando penso nas minhas falhas, fico a repetir esse pensamento vezes sem conta.", en: "When I think about my flaws, I keep replaying that thought over and over." },
    { r: false, pt: "Trato-me com paciência nos momentos de maior dificuldade.", en: "I treat myself with patience in my most difficult moments." },
    { r: true,  pt: "Fico irritado/a comigo mesmo/a sempre que noto um defeito meu.", en: "I get irritated with myself whenever I notice a flaw in myself." },
    { r: false, pt: "Tento lembrar-me de que sentir-me imperfeito/a faz parte de ser humano.", en: "I try to remind myself that feeling imperfect is part of being human." },
    { r: true,  pt: "Quando algo corre mal, sinto que os outros lidam melhor com essas situações do que eu.", en: "When something goes wrong, I feel like other people handle these situations better than I do." },
    { r: false, pt: "Consigo observar os meus pensamentos difíceis sem me deixar dominar por eles.", en: "I can observe my difficult thoughts without letting them take over." },
    { r: true,  pt: "Quando estou triste ou frustrado/a, essa emoção toma conta de tudo o resto.", en: "When I am sad or frustrated, that emotion takes over everything else." }
  ];

  var LIKERT = {
    pt: ["Quase nunca", "Poucas vezes", "Muitas vezes", "Quase sempre"],
    en: ["Almost never", "Rarely", "Often", "Almost always"]
  };

  var BANDS = [
    { max: 17, key: "low",  color: "var(--serious)",  icon: "🌱" },
    { max: 30, key: "mid",  color: "var(--brand)",    icon: "🤍" },
    { max: 36, key: "high", color: "var(--good)",     icon: "✨" }
  ];

  var answers = new Array(ITEMS.length).fill(-1);
  var idx = 0;
  var state = "intro";
  var $ = function (id) { return document.getElementById(id); };

  function show(panel) {
    $("panel-intro").classList.toggle("hidden", panel !== "intro");
    $("panel-quiz").classList.toggle("hidden", panel !== "quiz");
    $("panel-result").classList.toggle("hidden", panel !== "result");
    state = panel;
  }

  function renderQuestion() {
    var item = ITEMS[idx];
    $("qtext").textContent = item[PL.lang];
    $("qcount").textContent = (idx + 1) + " / " + ITEMS.length;
    $("pfill").style.width = (idx / ITEMS.length * 100) + "%";
    var lk = $("likert");
    lk.innerHTML = "";
    LIKERT[PL.lang].forEach(function (label, i) {
      var b = document.createElement("button");
      b.textContent = label;
      if (answers[idx] === i) b.classList.add("sel");
      b.addEventListener("click", function () {
        answers[idx] = i;
        b.classList.add("sel");
        setTimeout(function () {
          if (idx < ITEMS.length - 1) { idx++; renderQuestion(); }
          else { finish(); }
        }, 220);
      });
      lk.appendChild(b);
    });
    $("btn-back").disabled = idx === 0;
  }

  function score() {
    var s = 0;
    ITEMS.forEach(function (item, i) {
      s += item.r ? 3 - answers[i] : answers[i];
    });
    return s;
  }

  function bandOf(s) {
    for (var i = 0; i < BANDS.length; i++) if (s <= BANDS[i].max) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  function gauge(s) {
    var cx = 210, cy = 200, R = 150, W = 26;
    function pol(frac) {
      var a = Math.PI + frac * Math.PI;
      return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
    }
    function arc(f0, f1, color) {
      var p0 = pol(f0), p1 = pol(f1);
      var large = (f1 - f0) > 0.5 ? 1 : 0;
      return "<path d='M" + p0[0] + " " + p0[1] + " A" + R + " " + R + " 0 " + large + " 1 " + p1[0] + " " + p1[1] +
        "' fill='none' style='stroke:" + color + "' stroke-width='" + W + "'/>";
    }
    var gap = 0.008;
    var stops = [0, 17.5 / 36, 30.5 / 36, 1];
    var arcs = "";
    BANDS.forEach(function (b, i) {
      arcs += arc(stops[i] + (i ? gap : 0), stops[i + 1] - (i < BANDS.length - 1 ? gap : 0), b.color);
    });
    var f = Math.max(0.01, Math.min(0.99, s / 36));
    var tip = pol(f);
    var innerR = R - W / 2 - 12;
    var a = Math.PI + f * Math.PI;
    var base = [cx + innerR * Math.cos(a), cy + innerR * Math.sin(a)];
    var needle = "<line x1='" + base[0] + "' y1='" + base[1] + "' x2='" + tip[0] + "' y2='" + tip[1] +
      "' style='stroke:var(--ink)' stroke-width='4' stroke-linecap='round'/>";
    return "<svg viewBox='0 0 420 240' role='img' aria-label='Gauge'>" + arcs + needle +
      "<text x='" + cx + "' y='" + (cy - 30) + "' text-anchor='middle' font-size='52' font-weight='800' style='fill:var(--ink)'>" + s + "</text>" +
      "<text x='" + cx + "' y='" + (cy - 4) + "' text-anchor='middle' font-size='14' style='fill:var(--ink-3)'>/ 36</text>" +
      "<text x='" + (cx - R) + "' y='" + (cy + 26) + "' text-anchor='middle' font-size='12' style='fill:var(--ink-3)'>0</text>" +
      "<text x='" + (cx + R) + "' y='" + (cy + 26) + "' text-anchor='middle' font-size='12' style='fill:var(--ink-3)'>36</text>" +
      "</svg>";
  }

  function renderResult() {
    var s = score();
    var b = bandOf(s);
    $("gauge-wrap").innerHTML = gauge(s);
    $("badge-line").innerHTML = "<span class='status-badge'>" + b.icon + " <span style='color:" + b.color + "'>" + PL.t("lbl." + b.key) + "</span></span>";
    $("band-text").textContent = PL.t("band." + b.key);
  }

  function finish() {
    $("pfill").style.width = "100%";
    PL.saveTestResult("selfcompassion", score());
    renderResult();
    show("result");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("btn-start").addEventListener("click", function () {
    answers.fill(-1); idx = 0; show("quiz"); renderQuestion();
  });
  $("btn-back").addEventListener("click", function () {
    if (idx > 0) { idx--; renderQuestion(); }
  });
  $("btn-retake").addEventListener("click", function () {
    answers.fill(-1); idx = 0; show("quiz"); renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  PL.onLang(function () {
    if (state === "quiz") renderQuestion();
    if (state === "result") renderResult();
  });
})();
</script>
</body>
</html>
