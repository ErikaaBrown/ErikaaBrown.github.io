    },
    en: {
      "page.title": "Perfectionism",
      "crumb": "Tests",
      "intro.lead": "Having high standards can drive you forward, but when nothing is ever \"good enough\", perfectionism starts holding you back instead of helping you.",
      "intro.p1": "You will answer 10 statements about how you usually deal with mistakes, tasks and outcomes. Indicate how much you agree with each one.",

<script src="../js/app.js?v=11"></script>
<script>
(function () {
  var ITEMS = [
    { r: false, pt: "Sinto que, se não fizer algo perfeitamente, não vale a pena fazê-lo.", en: "I feel that if I can't do something perfectly, it's not worth doing." },
    { r: false, pt: "Costumo adiar tarefas com medo de não as fazer bem o suficiente.", en: "I tend to put off tasks for fear of not doing them well enough." },
    { r: false, pt: "Julgo-me com dureza quando cometo um erro, mesmo pequeno.", en: "I judge myself harshly when I make a mistake, even a small one." },
    { r: false, pt: "Só me sinto satisfeito/a com um trabalho quando é impecável.", en: "I only feel satisfied with a piece of work when it is flawless." },
    { r: true,  pt: "Consigo reconhecer o meu progresso, mesmo quando o resultado final não é perfeito.", en: "I can recognise my progress, even when the final result isn't perfect." },
    { r: false, pt: "Preocupo-me mais com o que os outros vão pensar do resultado do que com o processo em si.", en: "I worry more about what others will think of the result than about the process itself." },
    { r: true,  pt: "Aceito bem que «suficientemente bom» às vezes chega.", en: "I'm fine with \"good enough\" being enough, sometimes." },
    { r: false, pt: "Sinto que um erro pequeno pode arruinar todo o meu esforço.", en: "I feel that one small mistake can ruin all my effort." },
    { r: true,  pt: "Consigo terminar e entregar tarefas mesmo sabendo que não ficarão perfeitas.", en: "I can finish and hand in tasks even knowing they won't be perfect." },
    { r: false, pt: "Sinto necessidade de que alguém valide o meu trabalho para o considerar bom.", en: "I feel the need for someone to validate my work before I consider it good." }
  ];

  var LIKERT = {
    pt: ["Discordo totalmente", "Discordo", "Concordo", "Concordo totalmente"],
    en: ["Strongly disagree", "Disagree", "Agree", "Strongly agree"]
  };

  var BANDS = [
    { max: 12, key: "low",  color: "var(--good)",     icon: "🌱" },
    { max: 21, key: "mid",  color: "var(--brand)",    icon: "🎯" },
    { max: 30, key: "high", color: "var(--serious)",  icon: "🔶" }
  ];

  var answers = new Array(ITEMS.length).fill(-1);
  var idx = 0;
  var state = "intro";
  var $ = function (id) { return document.getElementById(id); };

  function show(panel) {
    $("panel-intro").classList.toggle("hidden", panel !== "intro");
    $("panel-quiz").classList.toggle("hidden", panel !== "quiz");
    $("panel-result").classList.toggle("hidden", panel !== "result");
    state = panel;
  }

  function renderQuestion() {
    var item = ITEMS[idx];
    $("qtext").textContent = item[PL.lang];
    $("qcount").textContent = (idx + 1) + " / " + ITEMS.length;
    $("pfill").style.width = (idx / ITEMS.length * 100) + "%";
    var lk = $("likert");
    lk.innerHTML = "";
    LIKERT[PL.lang].forEach(function (label, i) {
      var b = document.createElement("button");
      b.textContent = label;
      if (answers[idx] === i) b.classList.add("sel");
      b.addEventListener("click", function () {
        answers[idx] = i;
        b.classList.add("sel");
        setTimeout(function () {
          if (idx < ITEMS.length - 1) { idx++; renderQuestion(); }
          else { finish(); }
        }, 220);
      });
      lk.appendChild(b);
    });
    $("btn-back").disabled = idx === 0;
  }

  function score() {
    var s = 0;
    ITEMS.forEach(function (item, i) {
      s += item.r ? 3 - answers[i] : answers[i];
    });
    return s;
  }

  function bandOf(s) {
    for (var i = 0; i < BANDS.length; i++) if (s <= BANDS[i].max) return BANDS[i];
    return BANDS[BANDS.length - 1];
  }

  function gauge(s) {
    var cx = 210, cy = 200, R = 150, W = 26;
    function pol(frac) {
      var a = Math.PI + frac * Math.PI;
      return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
    }
    function arc(f0, f1, color) {
      var p0 = pol(f0), p1 = pol(f1);
      var large = (f1 - f0) > 0.5 ? 1 : 0;
      return "<path d='M" + p0[0] + " " + p0[1] + " A" + R + " " + R + " 0 " + large + " 1 " + p1[0] + " " + p1[1] +
        "' fill='none' style='stroke:" + color + "' stroke-width='" + W + "'/>";
    }
    var gap = 0.008;
    var stops = [0, 12.5 / 30, 21.5 / 30, 1];
    var arcs = "";
    BANDS.forEach(function (b, i) {
      arcs += arc(stops[i] + (i ? gap : 0), stops[i + 1] - (i < BANDS.length - 1 ? gap : 0), b.color);
    });
    var f = Math.max(0.01, Math.min(0.99, s / 30));
    var tip = pol(f);
    var innerR = R - W / 2 - 12;
    var a = Math.PI + f * Math.PI;
    var base = [cx + innerR * Math.cos(a), cy + innerR * Math.sin(a)];
    var needle = "<line x1='" + base[0] + "' y1='" + base[1] + "' x2='" + tip[0] + "' y2='" + tip[1] +
      "' style='stroke:var(--ink)' stroke-width='4' stroke-linecap='round'/>";
    return "<svg viewBox='0 0 420 240' role='img' aria-label='Gauge'>" + arcs + needle +
      "<text x='" + cx + "' y='" + (cy - 30) + "' text-anchor='middle' font-size='52' font-weight='800' style='fill:var(--ink)'>" + s + "</text>" +
      "<text x='" + cx + "' y='" + (cy - 4) + "' text-anchor='middle' font-size='14' style='fill:var(--ink-3)'>/ 30</text>" +
      "<text x='" + (cx - R) + "' y='" + (cy + 26) + "' text-anchor='middle' font-size='12' style='fill:var(--ink-3)'>0</text>" +
      "<text x='" + (cx + R) + "' y='" + (cy + 26) + "' text-anchor='middle' font-size='12' style='fill:var(--ink-3)'>30</text>" +
      "</svg>";
  }

  function renderResult() {
    var s = score();
    var b = bandOf(s);
    $("gauge-wrap").innerHTML = gauge(s);
    $("badge-line").innerHTML = "<span class='status-badge'>" + b.icon + " <span style='color:" + b.color + "'>" + PL.t("lbl." + b.key) + "</span></span>";
    $("band-text").textContent = PL.t("band." + b.key);
  }

  function finish() {
    $("pfill").style.width = "100%";
    PL.saveTestResult("perfectionism", score());
    renderResult();
    show("result");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("btn-start").addEventListener("click", function () {
    answers.fill(-1); idx = 0; show("quiz"); renderQuestion();
  });
  $("btn-back").addEventListener("click", function () {
    if (idx > 0) { idx--; renderQuestion(); }
  });
  $("btn-retake").addEventListener("click", function () {
    answers.fill(-1); idx = 0; show("quiz"); renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  PL.onLang(function () {
    if (state === "quiz") renderQuestion();
    if (state === "result") renderResult();
  });
})();
</script>
