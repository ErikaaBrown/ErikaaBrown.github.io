<body>
<div id="site-header"></div>

<main class="container narrow">
  <div class="page-hero">
    <span class="crumb" data-i18n="crumb"></span>
    <h1><span style="font-size:2.2rem">🎭</span> <span data-i18n="page.title"></span></h1>
    <p data-i18n="intro.lead"></p>
  </div>

  <section id="panel-intro" class="panel">
    <p data-i18n="intro.p1"></p>
    <p class="small muted" id="best-line"></p>
    <div class="center mt-2">
      <button class="btn" id="btn-start" data-i18n="btn.start"></button>
    </div>
  </section>

  <section id="panel-game" class="panel hidden">
    <div class="progress-track"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <p class="small muted" id="qcount"></p>
    <div class="scenario-box" id="word" style="max-width:none;font-size:1.3rem;margin-bottom:18px"></div>
    <p class="small muted center" data-i18n="q.prompt"></p>
    <div class="opt-list" id="options" style="max-width:420px;margin:0 auto"></div>
    <div id="feedback" class="hidden" style="margin-top:18px">
      <div class="notice" id="feedback-text"></div>
      <div class="center">
        <button class="btn btn-sm" id="btn-next" data-i18n="btn.next"></button>
      </div>
    </div>
  </section>

  <section id="panel-result" class="hidden">
    <div class="panel center">
      <h2 style="margin-top:0" data-i18n="res.title"></h2>
      <div class="tiles" style="max-width:340px;margin:1rem auto">
        <div class="tile"><div class="num" id="r-score"></div><div class="lbl" data-i18n="res.score"></div></div>
        <div class="tile"><div class="num" id="r-best"></div><div class="lbl" data-i18n="res.best"></div></div>
      </div>
      <p id="r-comment" class="muted" style="max-width:520px;margin:0 auto"></p>
    </div>
    <div class="panel panel-soft">
      <p style="margin:0" data-i18n="res.expl"></p>
    </div>
    <div class="center mt-2">
      <button class="btn" id="btn-again" data-i18n="btn.again"></button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "games",
  i18n: {

      "best.prefix": "O teu recorde: ",

      "q.prompt": "A que emoção principal pertence esta palavra?",
      "fb.right": "✔️ Certo! ",
      "fb.wrong": "✖️ Pertence a ",
      "res.title": "Resultado",
      "res.score": "em 16",
      "res.best": "Recorde",
      "res.c1": "Vocabulário emocional muito preciso! Isso ajuda-te a comunicar melhor o que sentes, e a regular melhor essas emoções.",
      "res.c2": "Bom conhecimento das famílias de emoções. Vale a pena continuar a treinar a precisão.",

      "new.record": "Novo recorde! 🏆",
      "fam.joy": "Alegria", "fam.trust": "Confiança", "fam.fear": "Medo", "fam.surprise": "Surpresa",
      "fam.sadness": "Tristeza", "fam.disgust": "Aversão", "fam.anger": "Raiva", "fam.anticipation": "Antecipação"
    },
    en: {
      "page.title": "Wheel of Emotions",
      "crumb": "Games",
      "intro.lead": "The more precise the words you use to name what you feel, the easier it is to handle it. This is called emotional granularity.",
      "intro.p1": "You will see 16 words describing more specific emotions. For each one, identify which primary emotion it belongs to, according to Plutchik's Wheel of Emotions: joy, trust, fear, surprise, sadness, disgust, anger or anticipation.",
      "best.prefix": "Your record: ",
      "btn.start": "Start",

<script src="../js/app.js?v=5"></script>
<script>
(function () {
  var FAMILIES = ["joy", "trust", "fear", "surprise", "sadness", "disgust", "anger", "anticipation"];

  var ITEMS = [
    { fam: "joy",          pt: "Contentamento", en: "Contentment" },
    { fam: "joy",          pt: "Euforia", en: "Euphoria" },
    { fam: "trust",        pt: "Aceitação", en: "Acceptance" },
    { fam: "trust",        pt: "Admiração", en: "Admiration" },
    { fam: "fear",         pt: "Apreensão", en: "Apprehension" },
    { fam: "fear",         pt: "Pavor", en: "Terror" },
    { fam: "surprise",     pt: "Espanto", en: "Amazement" },
    { fam: "surprise",     pt: "Assombro", en: "Astonishment" },
    { fam: "sadness",      pt: "Melancolia", en: "Pensiveness" },
    { fam: "sadness",      pt: "Desolação", en: "Grief" },
    { fam: "disgust",      pt: "Tédio", en: "Boredom" },
    { fam: "disgust",      pt: "Repulsa", en: "Loathing" },
    { fam: "anger",        pt: "Irritação", en: "Annoyance" },
    { fam: "anger",        pt: "Fúria", en: "Rage" },
    { fam: "anticipation", pt: "Interesse", en: "Interest" },
    { fam: "anticipation", pt: "Vigilância", en: "Vigilance" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var order = [], idx = 0, score = 0, state = "intro", answered = false, roundOpts = [];

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function scores() { return PL.load("scores", {}); }

  function show(p) {
    $("panel-intro").classList.toggle("hidden", p !== "intro");
    $("panel-game").classList.toggle("hidden", p !== "game");
    $("panel-result").classList.toggle("hidden", p !== "result");
    state = p;
  }

  function bestLine() {
    var b = scores().emotionwheel || 0;
    $("best-line").textContent = b ? PL.t("best.prefix") + b + "/16" : "";
  }

  function optionsFor(correctFam) {
    var distractors = shuffled(FAMILIES.filter(function (f) { return f !== correctFam; })).slice(0, 3);
    return shuffled(distractors.concat([correctFam]));
  }

  function renderRound() {
    var it = ITEMS[order[idx]];
    answered = false;
    roundOpts = optionsFor(it.fam);
    $("qcount").textContent = (idx + 1) + " / " + ITEMS.length;
    $("pfill").style.width = (idx / ITEMS.length * 100) + "%";
    $("feedback").classList.add("hidden");
    $("word").textContent = "«" + it[PL.lang] + "»";
    var box = $("options");
    box.innerHTML = "";
    roundOpts.forEach(function (fam) {
      var b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = PL.t("fam." + fam);
      b.setAttribute("data-fam", fam);
      b.addEventListener("click", function () { pick(fam, b); });
      box.appendChild(b);
    });
  }

  function pick(fam, btn) {
    if (answered) return;
    answered = true;
    var it = ITEMS[order[idx]];
    var right = fam === it.fam;
    if (right) score++;
    document.querySelectorAll("#options button").forEach(function (b) {
      b.disabled = true;
      if (b.getAttribute("data-fam") === it.fam) b.classList.add("correct");
    });
    if (!right) btn.classList.add("wrong");
    var prefix = right ? PL.t("fb.right") : PL.t("fb.wrong") + "«" + PL.t("fam." + it.fam) + "». ";
    $("feedback-text").textContent = prefix;
    $("feedback").classList.remove("hidden");
  }

  function next() {
    idx++;
    if (idx >= ITEMS.length) {
      var sc = scores();
      var isRecord = score > (sc.emotionwheel || 0);
      if (isRecord) {
        sc.emotionwheel = score;
        PL.store("scores", sc);
      }
      renderResult(isRecord);
      show("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      renderRound();
    }
  }

  function renderResult(isRecord) {
    $("r-score").textContent = score;
    $("r-best").textContent = (scores().emotionwheel || score) + "/16";
    var c = score >= 14 ? "res.c1" : score >= 9 ? "res.c2" : "res.c3";
    $("r-comment").textContent = (isRecord ? PL.t("new.record") + " " : "") + PL.t(c);
  }

  function start() {
    order = shuffled(ITEMS.map(function (_, i) { return i; }));
    idx = 0; score = 0;
    show("game");
    renderRound();
  }

  $("btn-start").addEventListener("click", start);
  $("btn-again").addEventListener("click", function () {
    start();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("btn-next").addEventListener("click", next);

  document.addEventListener("pl:ready", bestLine);
  PL.onLang(function () {
    bestLine();
    if (state === "game" && !answered) renderRound();
    if (state === "result") renderResult(false);
  });
})();
</script>
</body>
</html>
