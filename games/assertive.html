<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html.pl-framed{display:none!important}</style>
<script>if(window.top!==window.self){document.documentElement.className+=" pl-framed";try{window.top.location=window.self.location.href;}catch(e){}}</script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://psicolab-api.nightmareftw.workers.dev; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Assertividade em Acção · PsicoLab</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=15">
</head>
<body>
<div id="site-header"></div>

<main class="container narrow">
  <div class="page-hero">
    <span class="crumb" data-i18n="crumb"></span>
    <h1><span style="font-size:2.2rem">⚖️</span> <span data-i18n="page.title"></span></h1>
    <p data-i18n="intro.lead"></p>
  </div>

  <section id="panel-intro" class="panel">
    <p data-i18n="intro.p1"></p>
    <p class="small muted" id="best-line"></p>
    <div class="center mt-2">
      <button class="btn" id="btn-start" data-i18n="btn.start"></button>
    </div>
  </section>

  <section id="panel-game" class="panel hidden">
    <div class="progress-track"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <p class="small muted" id="qcount"></p>
    <div class="scenario-box" id="situation" style="max-width:none;margin-bottom:18px"></div>
    <p class="small muted center" data-i18n="q.prompt"></p>
    <div class="opt-list" id="options"></div>
    <div id="feedback" class="hidden" style="margin-top:18px">
      <div class="notice" id="feedback-text"></div>
      <div class="center">
        <button class="btn btn-sm" id="btn-next" data-i18n="btn.next"></button>
      </div>
    </div>
  </section>

  <section id="panel-result" class="hidden">
    <div class="panel center">
      <h2 style="margin-top:0" data-i18n="res.title"></h2>
      <div class="tiles" style="max-width:340px;margin:1rem auto">
        <div class="tile"><div class="num" id="r-score"></div><div class="lbl" data-i18n="res.score"></div></div>
        <div class="tile"><div class="num" id="r-best"></div><div class="lbl" data-i18n="res.best"></div></div>
      </div>
      <p id="r-comment" class="muted" style="max-width:520px;margin:0 auto"></p>
    </div>
    <div class="panel panel-soft">
      <p style="margin:0" data-i18n="res.expl"></p>
    </div>
    <div class="center mt-2">
      <button class="btn" id="btn-again" data-i18n="btn.again"></button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "games",
  i18n: {
    pt: {
      "page.title": "Assertividade em Acção",
      "crumb": "Jogos",
      "intro.lead": "Passivo, agressivo, passivo-agressivo ou assertivo? Consegues identificar a resposta mais equilibrada em cada situação?",
      "intro.p1": "Vais ler 10 situações do dia a dia. Para cada uma, escolhe, entre as 4 opções, a resposta assertiva, aquela que expressa a necessidade com clareza e respeito, sem se apagar nem atacar o outro.",
      "best.prefix": "O teu recorde: ",
      "btn.start": "Começar",
      "btn.next": "Seguinte →",
      "btn.again": "Jogar outra vez",
      "q.prompt": "Qual destas é a resposta assertiva?",
      "fb.right": "✔️ Certo, essa é a resposta assertiva. ",
      "fb.wrong": "✖️ A assertiva era: «",
      "fb.wrong2": "». ",
      "res.title": "Resultado",
      "res.score": "em 10",
      "res.best": "Recorde",
      "res.c1": "Excelente olho para identificar assertividade real, distinta de passividade, agressividade e passivo-agressividade.",
      "res.c2": "Bom instinto. A linha entre assertividade e agressividade nem sempre é óbvia à primeira vista.",
      "res.c3": "É normal confundir os quatro estilos. A assertividade é sempre directa E respeitosa, ao mesmo tempo.",
      "res.expl": "⚖️ Os quatro estilos: passivo (apaga a própria necessidade), agressivo (impõe-se à custa do outro), passivo-agressivo (expressa a insatisfação de forma indirecta, como ironia ou silêncio hostil) e assertivo (expressa a necessidade com clareza, sem atacar). A assertividade é geralmente a mais eficaz a longo prazo, para ambas as partes.",
      "new.record": "Novo recorde! 🏆"
    },
    en: {
      "page.title": "Assertiveness in Action",
      "crumb": "Games",
      "intro.lead": "Passive, aggressive, passive-aggressive or assertive? Can you identify the most balanced response in each situation?",
      "intro.p1": "You will read 10 everyday situations. For each one, pick, among 4 options, the assertive response, the one that expresses the need clearly and respectfully, without erasing yourself or attacking the other person.",
      "best.prefix": "Your record: ",
      "btn.start": "Start",
      "btn.next": "Next →",
      "btn.again": "Play again",
      "q.prompt": "Which of these is the assertive response?",
      "fb.right": "✔️ Correct, that's the assertive response. ",
      "fb.wrong": "✖️ The assertive one was: \"",
      "fb.wrong2": "\". ",
      "res.title": "Result",
      "res.score": "out of 10",
      "res.best": "Record",
      "res.c1": "Excellent eye for spotting real assertiveness, distinct from passivity, aggression and passive-aggression.",
      "res.c2": "Good instinct. The line between assertiveness and aggression isn't always obvious at first glance.",
      "res.c3": "It's common to mix up the four styles. Assertiveness is always direct AND respectful, at the same time.",
      "res.expl": "⚖️ The four styles: passive (erases one's own need), aggressive (asserts itself at the other's expense), passive-aggressive (expresses dissatisfaction indirectly, like sarcasm or the silent treatment) and assertive (expresses the need clearly, without attacking). Assertiveness is generally the most effective in the long run, for both sides.",
      "new.record": "New record! 🏆"
    }
  }
};
</script>
<script src="../js/app.js?v=7"></script>
<script>
(function () {
  var ITEMS = [
    { s: { pt: "Um colega atribui-te tarefas extra sem perguntar, e já estás sobrecarregado/a.", en: "A coworker keeps assigning you extra tasks without asking, and you're already overloaded." },
      o: [
        { pt: "Aceitas sem dizer nada, mesmo sentindo-te sobrecarregado/a.", en: "You accept without saying anything, even feeling overloaded.", r: false },
        { pt: "Respondes irritado/a: «Já não aguento mais, pára de me sobrecarregar!»", en: "You snap: \"I can't take this anymore, stop dumping on me!\"", r: false },
        { pt: "Aceitas a tarefa, mas comentas com outros colegas pelas costas dele.", en: "You accept the task, but complain about them to other coworkers behind their back.", r: false },
        { pt: "Dizes com calma: «Neste momento já tenho muito no meu prato; conseguimos rever os prazos juntos?»", en: "You say calmly: \"I already have a lot on my plate right now; can we review the deadlines together?\"", r: true }
      ] },
    { s: { pt: "Um amigo cancela planos contigo pela terceira vez seguida, sem grande explicação.", en: "A friend cancels plans with you for the third time in a row, without much explanation." },
      o: [
        { pt: "Dizes: «Reparei que já cancelaste algumas vezes seguidas, está tudo bem? Gostava de perceber melhor.»", en: "You say: \"I've noticed you've cancelled a few times in a row, is everything okay? I'd like to understand better.\"", r: true },
        { pt: "Não dizes nada, mas começas a afastar-te dele sem explicar porquê.", en: "You say nothing, but start pulling away from them without explaining why.", r: false },
        { pt: "Escreves-lhe: «És sempre a mesma pessoa a desmarcar tudo, nem sei porque continuo a tentar.»", en: "You text them: \"You're always the one cancelling everything, I don't even know why I keep trying.\"", r: false },
        { pt: "Continuas a marcar planos na mesma, sem referires como te sentes com os cancelamentos.", en: "You keep making plans the same as always, without mentioning how the cancellations make you feel.", r: false }
      ] },
    { s: { pt: "Num restaurante, trouxeram-te um prato diferente do que pediste.", en: "At a restaurant, they brought you a different dish than the one you ordered." },
      o: [
        { pt: "Comes na mesma, para não incomodar ninguém.", en: "You eat it anyway, to avoid bothering anyone.", r: false },
        { pt: "Chamas o empregado e dizes, num tom hostil, que o restaurante é incompetente.", en: "You call the waiter over and say, in a hostile tone, that the restaurant is incompetent.", r: false },
        { pt: "Dizes calmamente: «Desculpe, acho que houve uma troca. Eu tinha pedido X, pode corrigir?»", en: "You say calmly: \"Excuse me, I think there was a mix-up. I ordered X, could you fix it?\"", r: true },
        { pt: "Comes o prato, mas deixas uma avaliação negativa online sem teres dito nada no momento.", en: "You eat the dish, but leave a negative review online without ever mentioning it in person.", r: false }
      ] },
    { s: { pt: "Um familiar faz um comentário sobre o teu peso à mesa de jantar.", en: "A relative makes a comment about your weight at the dinner table." },
      o: [
        { pt: "Ris-te sem jeito e mudas de assunto, guardando o desconforto para ti.", en: "You laugh awkwardly and change the subject, keeping the discomfort to yourself.", r: false },
        { pt: "Respondes na mesma moeda, com um comentário igualmente hostil sobre a pessoa.", en: "You fire back with an equally hostile comment about them.", r: false },
        { pt: "Dizes com calma: «Prefiro que não comentes o meu corpo, por favor.»", en: "You say calmly: \"I'd rather you didn't comment on my body, please.\"", r: true },
        { pt: "Não dizes nada ali, mas evitas esse familiar durante meses depois disso.", en: "You say nothing at the time, but avoid that relative for months afterward.", r: false }
      ] },
    { s: { pt: "O teu chefe elogia publicamente uma ideia tua, mas atribui-a a outra pessoa.", en: "Your boss publicly praises an idea of yours, but credits it to someone else." },
      o: [
        { pt: "Deixas passar, para não parecer que estás a competir com ninguém.", en: "You let it slide, so you don't seem like you're competing with anyone.", r: false },
        { pt: "Interrompes a reunião, irritado/a, a exigir reconhecimento imediato.", en: "You interrupt the meeting, angry, demanding immediate credit.", r: false },
        { pt: "Não dizes nada na reunião, mas desabafas com outros colegas sobre como isso foi injusto.", en: "You say nothing in the meeting, but vent to other coworkers about how unfair it was.", r: false },
        { pt: "Depois da reunião, falas em privado: «Acho que essa ideia partiu de mim, gostava que isso ficasse claro.»", en: "After the meeting, you speak privately: \"I believe that idea came from me, I'd like that to be clear.\"", r: true }
      ] },
    { s: { pt: "O teu par toma decisões importantes sem te consultar.", en: "Your partner makes important decisions without consulting you." },
      o: [
        { pt: "Dizes: «Gostava de ser incluído/a nestas decisões antes de estarem fechadas, isto afecta-nos aos dois.»", en: "You say: \"I'd like to be included in these decisions before they're final, this affects both of us.\"", r: true },
        { pt: "Aceitas em silêncio, mesmo sentindo que a tua opinião não conta.", en: "You accept it silently, even feeling like your opinion doesn't count.", r: false },
        { pt: "Gritas que ele/ela nunca pensa em mais ninguém além de si.", en: "You yell that they never think about anyone but themselves.", r: false },
        { pt: "Não dizes nada, mas passas a tomar decisões importantes sem o/a consultar também.", en: "You say nothing, but start making important decisions without consulting them either.", r: false }
      ] },
    { s: { pt: "Um vizinho faz barulho todas as noites e já não consegues dormir bem.", en: "A neighbour makes noise every night and you can no longer sleep well." },
      o: [
        { pt: "Aturas o barulho sem dizer nada, para não criar má relação.", en: "You put up with the noise without saying anything, to avoid a bad relationship.", r: false },
        { pt: "Bates à porta furioso/a e ameaças chamar a polícia sem antes falares com calma.", en: "You bang on the door furious and threaten to call the police without ever talking calmly first.", r: false },
        { pt: "Vais bater à porta e dizes: «Tenho tido dificuldade em dormir com o barulho à noite; conseguimos combinar um horário melhor?»", en: "You knock on their door and say: \"I've been having trouble sleeping because of the noise at night; can we work out a better schedule?\"", r: true },
        { pt: "Começas a fazer barulho também, à noite, como forma de retaliação silenciosa.", en: "You start making noise too, at night, as a form of silent retaliation.", r: false }
      ] },
    { s: { pt: "Pediram-te para trabalhar num feriado, pela terceira vez este ano, e queres descansar desta vez.", en: "You've been asked to work on a public holiday, for the third time this year, and you want to rest this time." },
      o: [
        { pt: "Aceitas outra vez, mesmo sentindo-te injustiçado/a.", en: "You agree again, even though you feel it's unfair.", r: false },
        { pt: "Recusas-te bruscamente, sem explicares a situação.", en: "You refuse abruptly, without explaining the situation.", r: false },
        { pt: "Aceitas, mas comentas com os colegas que a chefia é injusta contigo.", en: "You agree, but complain to coworkers that management is unfair to you.", r: false },
        { pt: "Dizes: «Já trabalhei nos dois últimos feriados; desta vez preciso mesmo de descansar. Conseguimos arranjar outra pessoa?»", en: "You say: \"I've worked the last two holidays; I really need to rest this time. Can we find someone else?\"", r: true }
      ] },
    { s: { pt: "Um amigo pede-te dinheiro emprestado outra vez, e ainda te deve da última vez.", en: "A friend asks to borrow money again, and still owes you from last time." },
      o: [
        { pt: "Dizes: «Ainda me deves da última vez; desta vez não posso emprestar mais.»", en: "You say: \"You still owe me from last time; I can't lend more this time.\"", r: true },
        { pt: "Emprestas outra vez, mesmo não querendo, para não pareceres mesquinho/a.", en: "You lend it again, even though you don't want to, to avoid seeming stingy.", r: false },
        { pt: "Recusas de forma seca, dizendo que ele/ela é um/a aproveitador/a.", en: "You refuse curtly, calling them a moocher.", r: false },
        { pt: "Dizes que sim, mas depois evitas as chamadas dele/dela durante semanas.", en: "You say yes, but then avoid their calls for weeks afterward.", r: false }
      ] },
    { s: { pt: "Estás numa reunião e alguém interrompe-te repetidamente enquanto falas.", en: "You're in a meeting and someone keeps interrupting you while you speak." },
      o: [
        { pt: "Paras de falar e deixas a ideia por dizer.", en: "You stop talking and leave the idea unsaid.", r: false },
        { pt: "Levantas a voz para falar por cima da pessoa.", en: "You raise your voice to talk over them.", r: false },
        { pt: "Dizes com calma: «Deixa-me só terminar o raciocínio e depois ouço com todo o gosto.»", en: "You say calmly: \"Let me just finish this thought, and then I'd love to hear you.\"", r: true },
        { pt: "Ficas calado/a na reunião, mas envias uma mensagem a queixar-te depois.", en: "You stay quiet in the meeting, but send a message complaining about it afterward.", r: false }
      ] }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var order = [], idx = 0, score = 0, state = "intro", answered = false;

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function scores() { return PL.load("scores", {}); }

  function show(p) {
    $("panel-intro").classList.toggle("hidden", p !== "intro");
    $("panel-game").classList.toggle("hidden", p !== "game");
    $("panel-result").classList.toggle("hidden", p !== "result");
    state = p;
  }

  function bestLine() {
    var b = scores().assertive || 0;
    $("best-line").textContent = b ? PL.t("best.prefix") + b + "/10" : "";
  }

  function renderRound() {
    var it = ITEMS[order[idx]];
    answered = false;
    $("qcount").textContent = (idx + 1) + " / " + ITEMS.length;
    $("pfill").style.width = (idx / ITEMS.length * 100) + "%";
    $("feedback").classList.add("hidden");
    $("situation").textContent = it.s[PL.lang];
    var box = $("options");
    box.innerHTML = "";
    var opts = shuffled(it.o);
    opts.forEach(function (opt) {
      var b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = opt[PL.lang];
      b.addEventListener("click", function () { pick(opt, b); });
      box.appendChild(b);
    });
  }

  function pick(opt, btn) {
    if (answered) return;
    answered = true;
    var right = !!opt.r;
    if (right) score++;
    var correctOpt = ITEMS[order[idx]].o.filter(function (o) { return o.r; })[0];
    document.querySelectorAll("#options button").forEach(function (b) {
      if (b.textContent === correctOpt[PL.lang]) b.classList.add("correct");
    });
    if (!right) btn.classList.add("wrong");
    var prefix = right ? PL.t("fb.right") : PL.t("fb.wrong") + correctOpt[PL.lang] + PL.t("fb.wrong2");
    $("feedback-text").textContent = prefix;
    $("feedback").classList.remove("hidden");
  }

  function next() {
    idx++;
    if (idx >= ITEMS.length) {
      var sc = scores();
      var isRecord = score > (sc.assertive || 0);
      if (isRecord) {
        sc.assertive = score;
        PL.store("scores", sc);
      }
      renderResult(isRecord);
      show("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      renderRound();
    }
  }

  function renderResult(isRecord) {
    $("r-score").textContent = score;
    $("r-best").textContent = (scores().assertive || score) + "/10";
    var c = score >= 8 ? "res.c1" : score >= 5 ? "res.c2" : "res.c3";
    $("r-comment").textContent = (isRecord ? PL.t("new.record") + " " : "") + PL.t(c);
  }

  function start() {
    order = shuffled(ITEMS.map(function (_, i) { return i; }));
    idx = 0; score = 0;
    show("game");
    renderRound();
  }

  $("btn-start").addEventListener("click", start);
  $("btn-again").addEventListener("click", function () {
    start();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("btn-next").addEventListener("click", next);

  document.addEventListener("pl:ready", bestLine);
  PL.onLang(function () {
    bestLine();
    if (state === "game" && !answered) renderRound();
    if (state === "result") renderResult(false);
  });
})();
</script>
</body>
</html>
