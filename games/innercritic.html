<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>html.pl-framed{display:none!important}</style>
<script>if(window.top!==window.self){document.documentElement.className+=" pl-framed";try{window.top.location=window.self.location.href;}catch(e){}}</script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://psicolab-api.nightmareftw.workers.dev; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>O Crítico Interno · PsicoLab</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=15">
</head>
<body>
<div id="site-header"></div>

<main class="container narrow">
  <div class="page-hero">
    <span class="crumb" data-i18n="crumb"></span>
    <h1><span style="font-size:2.2rem">👹</span> <span data-i18n="page.title"></span></h1>
    <p data-i18n="intro.lead"></p>
  </div>

  <section id="panel-intro" class="panel">
    <p data-i18n="intro.p1"></p>
    <p class="small muted" id="best-line"></p>
    <div class="center mt-2">
      <button class="btn" id="btn-start" data-i18n="btn.start"></button>
    </div>
  </section>

  <section id="panel-game" class="panel hidden">
    <div class="progress-track"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <p class="small muted" id="qcount"></p>
    <p class="small muted" data-i18n="q.situation" style="margin-bottom:2px"></p>
    <div class="scenario-box" id="situation" style="max-width:none;margin-bottom:10px"></div>
    <p class="small muted" data-i18n="q.thought" style="margin-bottom:2px"></p>
    <div class="scenario-box" id="thought" style="max-width:none;font-style:italic;margin-bottom:18px"></div>
    <p class="small muted center" data-i18n="q.prompt"></p>
    <div class="opt-list" id="options"></div>
    <div id="feedback" class="hidden" style="margin-top:18px">
      <div class="notice" id="feedback-text"></div>
      <div class="center">
        <button class="btn btn-sm" id="btn-next" data-i18n="btn.next"></button>
      </div>
    </div>
  </section>

  <section id="panel-result" class="hidden">
    <div class="panel center">
      <h2 style="margin-top:0" data-i18n="res.title"></h2>
      <div class="tiles" style="max-width:340px;margin:1rem auto">
        <div class="tile"><div class="num" id="r-score"></div><div class="lbl" data-i18n="res.score"></div></div>
        <div class="tile"><div class="num" id="r-best"></div><div class="lbl" data-i18n="res.best"></div></div>
      </div>
      <p id="r-comment" class="muted" style="max-width:520px;margin:0 auto"></p>
    </div>
    <div class="panel panel-soft">
      <p style="margin:0" data-i18n="res.expl"></p>
    </div>
    <div class="center mt-2">
      <button class="btn" id="btn-again" data-i18n="btn.again"></button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "games",
  i18n: {
    pt: {
      "page.title": "O Crítico Interno",
      "crumb": "Jogos",
      "intro.lead": "A voz que te critica por dentro nem sempre ajuda. Consegues encontrar a resposta mais autocompassiva a cada pensamento duro?",
      "intro.p1": "Vais ler 10 situações e o pensamento crítico que surge em cada uma. Escolhe, entre as 4 opções, a resposta mais autocompassiva, aquela que reconhece a dor sem a negar, e sem reforçar a crítica.",
      "best.prefix": "O teu recorde: ",
      "btn.start": "Começar",
      "btn.next": "Seguinte →",
      "btn.again": "Jogar outra vez",
      "q.situation": "SITUAÇÃO",
      "q.thought": "O PENSAMENTO QUE SURGE",
      "q.prompt": "Qual destas é a resposta mais autocompassiva?",
      "fb.right": "✔️ Essa é a resposta mais autocompassiva. ",
      "fb.wrong": "✖️ A mais autocompassiva era: «",
      "fb.wrong2": "». ",
      "res.title": "Resultado",
      "res.score": "em 10",
      "res.best": "Recorde",
      "res.c1": "Muito boa capacidade de reconhecer autocompaixão real, distinta de positividade tóxica ou de reforçar a autocrítica.",
      "res.c2": "Bom instinto. A autocompaixão não é indulgência nem negação, é reconhecer a dor e responder-lhe com gentileza.",

      "res.expl": "👹 O que é autocompaixão real: não é ignorar o problema, nem concordar com a voz mais dura, nem culpar os outros. É reconhecer o sofrimento (atenção plena), lembrar que não estás sozinho/a nisso (humanidade partilhada) e responder-te com a mesma gentileza que ofereceria a um amigo (bondade própria).",
      "new.record": "Novo recorde! 🏆"
    },
    en: {
      "page.title": "The Inner Critic",
      "crumb": "Games",
      "intro.lead": "The voice that criticises you inside doesn't always help. Can you find the most self-compassionate response to each harsh thought?",
      "intro.p1": "You will read 10 situations and the critical thought that shows up in each one. Pick, among 4 options, the most self-compassionate response, one that acknowledges the pain without denying it, and without reinforcing the criticism.",
      "best.prefix": "Your record: ",
      "btn.start": "Start",
      "btn.next": "Next →",
      "btn.again": "Play again",
      "q.situation": "SITUATION",
      "q.thought": "THE THOUGHT THAT ARISES",
      "q.prompt": "Which of these is the most self-compassionate response?",
      "fb.right": "✔️ That is the most self-compassionate response. ",
      "fb.wrong": "✖️ The most self-compassionate one was: \"",
      "fb.wrong2": "\". ",
      "res.title": "Result",
      "res.score": "out of 10",
      "res.best": "Record",
      "res.c1": "Very good at recognising real self-compassion, distinct from toxic positivity or reinforcing self-criticism.",
      "res.c2": "Good instinct. Self-compassion is neither indulgence nor denial, it's acknowledging the pain and answering it with kindness.",
      "res.c3": "It's common to confuse self-compassion with \"don't think about it\" or with agreeing with the inner critic. Neither is it. Keep practising.",
      "res.expl": "👹 What real self-compassion is: it's not ignoring the problem, agreeing with the harshest voice, or blaming others. It's acknowledging the suffering (mindfulness), remembering you are not alone in it (common humanity), and answering yourself with the same kindness you would offer a friend (self-kindness).",
      "new.record": "New record! 🏆"
    }
  }
};
</script>
<script src="../js/app.js?v=7"></script>
<script>
(function () {
  var ITEMS = [
    { s: { pt: "Falhaste uma entrevista de emprego que querias muito.", en: "You failed a job interview you really wanted." },
      t: { pt: "Sou mesmo inútil, nunca vou conseguir nada.", en: "I'm truly useless, I'll never achieve anything." },
      o: [
        { pt: "Isto dói porque me importava. Uma entrevista não define o meu valor; posso aprender e tentar de novo.", en: "This hurts because I cared. One interview doesn't define my worth; I can learn and try again.", r: true },
        { pt: "Não penses mais nisso, sorri e segue em frente.", en: "Don't think about it anymore, just smile and move on.", r: false },
        { pt: "Tens razão, provavelmente não eras bom/a candidato/a mesmo.", en: "You're right, you probably weren't a good candidate anyway.", r: false },
        { pt: "A culpa foi só do entrevistador, ele não percebeu nada.", en: "It was all the interviewer's fault, they didn't understand anything.", r: false }
      ] },
    { s: { pt: "Esqueceste-te de um compromisso importante com um amigo.", en: "You forgot an important commitment with a friend." },
      t: { pt: "Sou uma pessoa horrível, não mereço a amizade de ninguém.", en: "I'm a horrible person, I don't deserve anyone's friendship." },
      o: [
        { pt: "Toda a gente se esquece de coisas às vezes. Isso não apaga tudo o resto que já dei a esta amizade.", en: "Everyone forgets things sometimes. That doesn't erase everything else I've given to this friendship.", r: false },
        { pt: "Cometi um erro que magoou alguém que gosto. Faz sentido sentir-me mal; posso pedir desculpa e reparar.", en: "I made a mistake that hurt someone I care about. It makes sense to feel bad; I can apologise and make it right.", r: true },
        { pt: "Não vale a pena pedir desculpa, já estragaste tudo.", en: "There's no point apologising, you've already ruined everything.", r: false },
        { pt: "Se calhar o compromisso nem era assim tão importante.", en: "Maybe the commitment wasn't even that important.", r: false }
      ] },
    { s: { pt: "Recebeste críticas duras a um trabalho em que te esforçaste muito.", en: "You received harsh criticism on work you tried really hard on." },
      t: { pt: "Nunca vou ser bom/a o suficiente nisto.", en: "I'll never be good enough at this." },
      o: [
        { pt: "As críticas não prestavam, quem as fez é que não percebe nada.", en: "The criticism was worthless, whoever gave it doesn't understand anything.", r: false },
        { pt: "É desconfortável ouvir isto, mas não preciso de exagerar: aprender faz parte, não sou o meu pior trabalho.", en: "It's uncomfortable to hear this, but I don't need to exaggerate: learning is part of it, I am not my worst piece of work.", r: true },
        { pt: "Se calhar têm razão e nunca devias ter tentado.", en: "Maybe they're right and you should never have tried.", r: false },
        { pt: "Isso não importa nada, esquece e faz de conta que não ouviste.", en: "That doesn't matter at all, forget it and pretend you never heard it.", r: false }
      ] },
    { s: { pt: "Ganhaste peso e não gostas do que vês ao espelho.", en: "You gained weight and don't like what you see in the mirror." },
      t: { pt: "O meu corpo é repugnante, tenho de o odiar até mudar.", en: "My body is repulsive, I have to hate it until it changes." },
      o: [
        { pt: "Este corpo já me carregou por toda a vida. Posso querer mudar coisas sem precisar de o odiar para isso.", en: "This body has carried me through my whole life. I can want to change things without needing to hate it to do so.", r: true },
        { pt: "É verdade, um corpo assim não merece cuidado nenhum.", en: "It's true, a body like this doesn't deserve any care.", r: false },
        { pt: "A aparência não importa nada, ignora completamente o que sentes.", en: "Appearance doesn't matter at all, completely ignore what you feel.", r: false },
        { pt: "A culpa é só da sociedade, tu não tens nada a ver com isto.", en: "It's entirely society's fault, you have nothing to do with this.", r: false }
      ] },
    { s: { pt: "Perdeste a paciência com o teu filho/a e levantaste a voz.", en: "You lost your patience with your child and raised your voice." },
      t: { pt: "Sou uma péssima mãe/um péssimo pai, estou a estragar-lhe a vida.", en: "I'm a terrible parent, I'm ruining their life." },
      o: [
        { pt: "Todos os pais perdem a paciência às vezes. Um momento difícil não apaga todos os momentos de cuidado.", en: "All parents lose their patience sometimes. One hard moment doesn't erase every moment of care.", r: true },
        { pt: "Não faças disto um drama, as crianças esquecem tudo rápido.", en: "Don't make a big deal of it, kids forget everything quickly.", r: false },
        { pt: "É verdade, provavelmente devias ter tido mais cuidado ao decidir ser pai/mãe.", en: "It's true, you probably should have thought harder before deciding to become a parent.", r: false },
        { pt: "Se ele/ela não se portasse assim, isto não acontecia.", en: "If they didn't behave like that, this wouldn't happen.", r: false }
      ] },
    { s: { pt: "Chumbaste um exame para o qual estudaste bastante.", en: "You failed an exam you studied hard for." },
      t: { pt: "Sou burro/a, nunca vou conseguir terminar este curso.", en: "I'm stupid, I'll never finish this course." },
      o: [
        { pt: "Esquece o exame, isso não interessa nada para a tua vida.", en: "Forget the exam, it doesn't matter for your life at all.", r: false },
        { pt: "Um resultado mau numa matéria difícil não mede a minha inteligência. Posso perceber o que correu mal e ajustar.", en: "One bad result in a hard subject doesn't measure my intelligence. I can figure out what went wrong and adjust.", r: true },
        { pt: "Se calhar não és mesmo feito/a para estudar.", en: "Maybe you're just not cut out for studying.", r: false },
        { pt: "A culpa foi só do professor, que fez um exame injusto.", en: "It's entirely the teacher's fault for making an unfair exam.", r: false }
      ] },
    { s: { pt: "Discutiste feio com o teu par e disseste algo de que te arrependes.", en: "You had an ugly fight with your partner and said something you regret." },
      t: { pt: "Estraguei tudo, sou incapaz de manter uma relação saudável.", en: "I ruined everything, I'm incapable of keeping a healthy relationship." },
      o: [
        { pt: "As pessoas em relações saudáveis também discutem. O que importa é como reparo isto agora.", en: "People in healthy relationships fight too. What matters is how I repair this now.", r: true },
        { pt: "Não vale a pena falar sobre isto, finge que nunca aconteceu.", en: "There's no point talking about it, pretend it never happened.", r: false },
        { pt: "Tens razão, provavelmente não sabes mesmo amar ninguém.", en: "You're right, you probably don't even know how to love anyone.", r: false },
        { pt: "Ele/ela é que provocou tudo, a culpa não foi tua.", en: "They provoked all of it, none of this was your fault.", r: false }
      ] },
    { s: { pt: "Cometeste um erro financeiro que te vai custar caro.", en: "You made a costly financial mistake." },
      t: { pt: "Sou irresponsável, nunca vou conseguir gerir a minha vida.", en: "I'm irresponsible, I'll never be able to manage my life." },
      o: [
        { pt: "Toda a gente comete erros com dinheiro. Posso aprender com este e planear os próximos passos com calma.", en: "Everyone makes money mistakes. I can learn from this one and plan the next steps calmly.", r: true },
        { pt: "Não vale a pena pensar nisso agora, esquece que aconteceu.", en: "No point thinking about it now, just forget it happened.", r: false },
        { pt: "É verdade, nunca vais saber lidar com dinheiro.", en: "It's true, you'll never know how to handle money.", r: false },
        { pt: "A culpa foi do banco, eles é que complicam tudo de propósito.", en: "It's the bank's fault, they complicate everything on purpose.", r: false }
      ] },
    { s: { pt: "Não conseguiste cumprir um prazo importante no trabalho.", en: "You missed an important deadline at work." },
      t: { pt: "Sou um fracasso profissional, todos devem estar a reparar nisso.", en: "I'm a professional failure, everyone must be noticing it." },
      o: [
        { pt: "Não interessa, ninguém repara nestas coisas mesmo.", en: "It doesn't matter, nobody really notices these things anyway.", r: false },
        { pt: "Um prazo falhado é um problema a resolver, não uma sentença sobre quem sou. Posso comunicar e ajustar.", en: "A missed deadline is a problem to solve, not a verdict on who I am. I can communicate and adjust.", r: true },
        { pt: "Se calhar deviam mesmo despedir-te, seria o mais justo.", en: "Maybe they really should fire you, that would be fair.", r: false },
        { pt: "A culpa é da equipa toda, tu fizeste o que pudeste sozinho/a.", en: "It's the whole team's fault, you did everything you could alone.", r: false }
      ] },
    { s: { pt: "Comparaste-te com alguém que parece ter tudo resolvido nas redes sociais.", en: "You compared yourself to someone who seems to have it all figured out on social media." },
      t: { pt: "A minha vida é um desastre comparada com a dele/dela.", en: "My life is a mess compared to theirs." },
      o: [
        { pt: "As redes sociais mostram só um recorte escolhido. Comparar o que vejo por fora com o que sinto por dentro não é justo comigo.", en: "Social media only shows a chosen slice. Comparing what I see from outside with what I feel from inside isn't fair to me.", r: true },
        { pt: "As redes sociais não têm importância nenhuma, ignora tudo por completo.", en: "Social media doesn't matter at all, ignore all of it completely.", r: false },
        { pt: "É mesmo verdade, a vida dessa pessoa é claramente melhor que a tua.", en: "It's really true, that person's life is clearly better than yours.", r: false },
        { pt: "Essas pessoas é que fingem tudo, a vida delas também deve ser um desastre.", en: "Those people are just faking it all, their life is probably a mess too.", r: false }
      ] }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var order = [], idx = 0, score = 0, state = "intro", answered = false;

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function scores() { return PL.load("scores", {}); }

  function show(p) {
    $("panel-intro").classList.toggle("hidden", p !== "intro");
    $("panel-game").classList.toggle("hidden", p !== "game");
    $("panel-result").classList.toggle("hidden", p !== "result");
    state = p;
  }

  function bestLine() {
    var b = scores().innercritic || 0;
    $("best-line").textContent = b ? PL.t("best.prefix") + b + "/10" : "";
  }

  function renderRound() {
    var it = ITEMS[order[idx]];
    answered = false;
    $("qcount").textContent = (idx + 1) + " / " + ITEMS.length;
    $("pfill").style.width = (idx / ITEMS.length * 100) + "%";
    $("feedback").classList.add("hidden");
    $("situation").textContent = it.s[PL.lang];
    $("thought").textContent = "«" + it.t[PL.lang] + "»";
    var box = $("options");
    box.innerHTML = "";
    var opts = shuffled(it.o);
    opts.forEach(function (opt) {
      var b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = opt[PL.lang];
      b.addEventListener("click", function () { pick(opt, b); });
      box.appendChild(b);
    });
  }

  function pick(opt, btn) {
    if (answered) return;
    answered = true;
    var right = !!opt.r;
    if (right) score++;
    var correctOpt = ITEMS[order[idx]].o.filter(function (o) { return o.r; })[0];
    document.querySelectorAll("#options button").forEach(function (b) {
      if (b.textContent === correctOpt[PL.lang]) b.classList.add("correct");
    });
    if (!right) btn.classList.add("wrong");
    var prefix = right ? PL.t("fb.right") : PL.t("fb.wrong") + correctOpt[PL.lang] + PL.t("fb.wrong2");
    $("feedback-text").textContent = prefix;
    $("feedback").classList.remove("hidden");
  }

  function next() {
    idx++;
    if (idx >= ITEMS.length) {
      var sc = scores();
      var isRecord = score > (sc.innercritic || 0);
      if (isRecord) {
        sc.innercritic = score;
        PL.store("scores", sc);
      }
      renderResult(isRecord);
      show("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      renderRound();
    }
  }

  function renderResult(isRecord) {
    $("r-score").textContent = score;
    $("r-best").textContent = (scores().innercritic || score) + "/10";
    var c = score >= 8 ? "res.c1" : score >= 5 ? "res.c2" : "res.c3";
    $("r-comment").textContent = (isRecord ? PL.t("new.record") + " " : "") + PL.t(c);
  }

  function start() {
    order = shuffled(ITEMS.map(function (_, i) { return i; }));
    idx = 0; score = 0;
    show("game");
    renderRound();
  }

  $("btn-start").addEventListener("click", start);
  $("btn-again").addEventListener("click", function () {
    start();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("btn-next").addEventListener("click", next);

  document.addEventListener("pl:ready", bestLine);
  PL.onLang(function () {
    bestLine();
    if (state === "game" && !answered) renderRound();
    if (state === "result") renderResult(false);
  });
})();
</script>
</body>
</html>
