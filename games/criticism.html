<main class="container narrow">

    <div class="center mt-2">
      <button class="btn" id="btn-start" data-i18n="btn.start"></button>
    </div>

  <section id="panel-game" class="panel hidden">
    <div class="progress-track"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <p class="small muted" id="qcount"></p>
    <div class="scenario-box" id="statement" style="max-width:none;font-size:1.15rem;margin-bottom:18px"></div>
    <div style="display:flex;gap:12px;justify-content:center">
      <button class="btn btn-ghost" id="btn-constructive" style="min-width:140px"></button>
      <button class="btn" id="btn-destructive" style="min-width:140px"></button>
    </div>
    <div id="feedback" class="hidden" style="margin-top:18px">
      <div class="notice" id="feedback-text"></div>
      <div class="center">
        <button class="btn btn-sm" id="btn-next" data-i18n="btn.next"></button>
      </div>
    </div>
  </section>

  <section id="panel-result" class="hidden">
    <div class="panel center">
      <h2 style="margin-top:0" data-i18n="res.title"></h2>
      <div class="tiles" style="max-width:340px;margin:1rem auto">
        <div class="tile"><div class="num" id="r-score"></div><div class="lbl" data-i18n="res.score"></div></div>
        <div class="tile"><div class="num" id="r-best"></div><div class="lbl" data-i18n="res.best"></div></div>
      </div>
      <p id="r-comment" class="muted" style="max-width:520px;margin:0 auto"></p>
    </div>
    <div class="panel panel-soft">
      <p style="margin:0" data-i18n="res.expl"></p>
    </div>
    <div class="center mt-2">
      <button class="btn" id="btn-again" data-i18n="btn.again"></button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "games",
  i18n: {
    pt: {
      "page.title": "Crítica Construtiva ou Destrutiva?",
      "crumb": "Jogos",
      "intro.lead": "Nem toda a crítica é igual: uma ajuda a crescer, outra só magoa e bloqueia. Consegues distinguir?",
      "intro.p1": "Vais ler 12 críticas, algumas ditas a outra pessoa, outras que são autocrítica. Para cada uma, decide: construtiva ou destrutiva?",
      "best.prefix": "O teu recorde: ",
      "btn.start": "Começar",
      "btn.next": "Seguinte →",
      "btn.again": "Jogar outra vez",
      "btn.constructive": "🌱 Construtiva",
      "btn.destructive": "🔥 Destrutiva",
      "fb.right": "✔️ Correto! ",
      "fb.wrong.constructive": "✖️ Na verdade é construtiva. ",
      "fb.wrong.destructive": "✖️ Na verdade é destrutiva. ",
      "res.title": "Resultado",
      "res.score": "em 12",
      "res.best": "Recorde",
      "res.c1": "Excelente! Distingues bem o que ajuda a crescer do que só magoa.",
      "res.c2": "Bom olho. A linha entre as duas nem sempre é óbvia, sobretudo na autocrítica.",
      "res.c3": "É normal confundir as duas, sobretudo quando a crítica é dirigida a nós mesmos.",
      "res.expl": "🧩 A regra simples: uma crítica construtiva fala de um comportamento específico e aponta um caminho («podias tentar X»); uma destrutiva ataca a pessoa e não oferece nenhuma saída («és sempre assim»). Vale para os outros e para o que dizes a ti mesmo/a.",
      "new.record": "Novo recorde! 🏆"
    },
    en: {
      "page.title": "Constructive or Destructive Criticism?",
      "crumb": "Games",
      "intro.lead": "Not all criticism is the same: some helps you grow, some just hurts and blocks you. Can you tell them apart?",
      "intro.p1": "You will read 12 pieces of criticism, some said to another person, some self-criticism. For each one, decide: constructive or destructive?",
      "best.prefix": "Your record: ",
      "btn.start": "Start",
      "btn.next": "Next →",
      "btn.again": "Play again",
      "btn.constructive": "🌱 Constructive",
      "btn.destructive": "🔥 Destructive",
      "fb.right": "✔️ Correct! ",
      "fb.wrong.constructive": "✖️ It's actually constructive. ",
      "fb.wrong.destructive": "✖️ It's actually destructive. ",
      "res.title": "Result",
      "res.score": "out of 12",
      "res.best": "Record",
      "res.c1": "Excellent! You can tell what helps you grow apart from what just hurts.",
      "res.c2": "Good eye. The line between them isn't always obvious, especially in self-criticism.",
      "res.c3": "It's common to mix up the two, especially when the criticism is aimed at ourselves.",
      "res.expl": "🧩 The simple rule: constructive criticism names a specific behaviour and points to a path forward (\"you could try X\"); destructive criticism attacks the person and offers no way out (\"you're always like this\"). It applies to others and to what you say to yourself.",
      "new.record": "New record! 🏆"
    }
  }
};
</script>
<script src="../js/app.js?v=11"></script>
<script>
(function () {
  var ITEMS = [
    { constructive: true,
      s: { pt: "«Já reparei que chegaste atrasado três vezes esta semana; para a próxima podemos combinar um alarme mais cedo?»", en: "\"I've noticed you've been late three times this week; could we set an earlier alarm for next time?\"" },
      ex: { pt: "Fala de um comportamento específico (os atrasos), sem insultos, e propõe uma solução concreta.", en: "It names a specific behaviour (the lateness), without insults, and proposes a concrete solution." } },
    { constructive: false,
      s: { pt: "«És sempre um desastre, nunca fazes nada bem.»", en: "\"You're always a disaster, you never do anything right.\"" },
      ex: { pt: "Ataca a pessoa («és»), generaliza («sempre», «nunca») e não aponta nenhum caminho a seguir.", en: "It attacks the person (\"you are\"), generalises (\"always\", \"never\") and offers no path forward." } },
    { constructive: true,
      s: { pt: "«Este relatório tem alguns erros de cálculo na secção 2; talvez valha a pena reveres essa parte.»", en: "\"This report has some calculation errors in section 2; it might be worth reviewing that part.\"" },
      ex: { pt: "Aponta um comportamento e uma secção específica, sem atacar a pessoa, com uma sugestão prática.", en: "It points to a specific, concrete section, without attacking the person, with a practical suggestion." } },
    { constructive: false,
      s: { pt: "«Não sei porque é que ainda tentam contigo, és mesmo inútil nisto.»", en: "\"I don't know why they still bother with you, you're really useless at this.\"" },
      ex: { pt: "É um ataque pessoal directo, sem qualquer sugestão de melhoria.", en: "It's a direct personal attack, with no suggestion for improvement." } },
    { constructive: false,
      s: { pt: "«Falhei outra vez, sou mesmo um fracasso.» (a dizer a ti mesmo/a)", en: "\"I failed again, I'm such a failure.\" (said to yourself)" },
      ex: { pt: "É autocrítica que ataca a identidade («sou um fracasso») em vez do comportamento específico que falhou.", en: "This is self-criticism that attacks identity (\"I'm a failure\") instead of the specific behaviour that fell short." } },
    { constructive: true,
      s: { pt: "«Não correu como esperava desta vez; para a próxima posso preparar-me melhor.» (a dizer a ti mesmo/a)", en: "\"That didn't go as I hoped this time; next time I can prepare better.\" (said to yourself)" },
      ex: { pt: "Reconhece o resultado sem atacar a identidade, e aponta um caminho concreto para melhorar.", en: "It acknowledges the outcome without attacking identity, and points to a concrete way to improve." } },
    { constructive: true,
      s: { pt: "«A tua apresentação teve boas ideias, mas ficaria mais clara com menos texto em cada slide.»", en: "\"Your presentation had good ideas, but it would be clearer with less text per slide.\"" },
      ex: { pt: "Reconhece algo positivo, aponta um comportamento específico a melhorar, sem insultos.", en: "It acknowledges something positive, names one specific thing to improve, without insults." } },
    { constructive: false,
      s: { pt: "«Só fazes asneira, devias desistir já.»", en: "\"You just mess everything up, you should just give up.\"" },
      ex: { pt: "Generaliza, ataca a pessoa e sugere desistir em vez de melhorar.", en: "It generalises, attacks the person, and suggests giving up instead of improving." } },
    { constructive: true,
      s: { pt: "«Podias ter avisado que ias chegar tarde; para a próxima manda uma mensagem, por favor.»", en: "\"You could have let me know you'd be late; next time please send a message.\"" },
      ex: { pt: "Refere-se a uma acção concreta e pede algo específico e realizável no futuro.", en: "It refers to a concrete action and asks for something specific and doable next time." } },
    { constructive: false,
      s: { pt: "«Tu não prestas mesmo para nada, sempre foste assim.»", en: "\"You're really no good at anything, you've always been like this.\"" },
      ex: { pt: "Ataque directo à identidade da pessoa, sem qualquer referência a um comportamento específico.", en: "A direct attack on the person's identity, with no reference to any specific behaviour." } },
    { constructive: true,
      s: { pt: "«Isto não ficou bem feito, mas sei que consegues melhorar se tentares de outra forma.» (a dizer a ti mesmo/a)", en: "\"This didn't turn out well, but I know I can improve if I try a different way.\" (said to yourself)" },
      ex: { pt: "Separa o resultado da identidade, e mantém a confiança na capacidade de melhorar.", en: "It separates the outcome from identity, and keeps confidence in the ability to improve." } },
    { constructive: false,
      s: { pt: "«Não acredito que fizeste isto outra vez, és um caso perdido.»", en: "\"I can't believe you did this again, you're a lost cause.\"" },
      ex: { pt: "Etiqueta a pessoa de forma definitiva e negativa, sem espaço para aprendizagem.", en: "It labels the person in a definitive, negative way, leaving no room for learning." } }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var idx = 0, score = 0, state = "intro", answered = false;

  function scores() { return PL.load("scores", {}); }

  function show(p) {
    $("panel-intro").classList.toggle("hidden", p !== "intro");
    $("panel-game").classList.toggle("hidden", p !== "game");
    $("panel-result").classList.toggle("hidden", p !== "result");
    state = p;
  }

  function bestLine() {
    var b = scores().criticism || 0;
    $("best-line").textContent = b ? PL.t("best.prefix") + b + "/12" : "";
  }

  function renderRound() {
    var it = ITEMS[idx];
    answered = false;
    $("qcount").textContent = (idx + 1) + " / " + ITEMS.length;
    $("pfill").style.width = (idx / ITEMS.length * 100) + "%";
    $("feedback").classList.add("hidden");
    $("statement").textContent = it.s[PL.lang];
    $("btn-constructive").textContent = PL.t("btn.constructive");
    $("btn-destructive").textContent = PL.t("btn.destructive");
    $("btn-constructive").disabled = false;
    $("btn-destructive").disabled = false;
  }

  function pick(saysConstructive) {
    if (answered) return;
    answered = true;
    var it = ITEMS[idx];
    var right = saysConstructive === it.constructive;
    if (right) score++;
    $("btn-constructive").disabled = true;
    $("btn-destructive").disabled = true;
    var prefix = right ? PL.t("fb.right") : PL.t(it.constructive ? "fb.wrong.constructive" : "fb.wrong.destructive");
    $("feedback-text").textContent = prefix + it.ex[PL.lang];
    $("feedback").classList.remove("hidden");
  }

  function next() {
    idx++;
    if (idx >= ITEMS.length) {
      var sc = scores();
      var isRecord = score > (sc.criticism || 0);
      if (isRecord) {
        sc.criticism = score;
        PL.store("scores", sc);
      }
      renderResult(isRecord);
      show("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      renderRound();
    }
  }

  function renderResult(isRecord) {
    $("r-score").textContent = score;
    $("r-best").textContent = (scores().criticism || score) + "/12";
    var c = score >= 11 ? "res.c1" : score >= 8 ? "res.c2" : "res.c3";
    $("r-comment").textContent = (isRecord ? PL.t("new.record") + " " : "") + PL.t(c);
  }

  function start() {
    idx = 0; score = 0;
    show("game");
    renderRound();
  }

  $("btn-start").addEventListener("click", start);
  $("btn-again").addEventListener("click", function () {
    start();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("btn-constructive").addEventListener("click", function () { pick(true); });
  $("btn-destructive").addEventListener("click", function () { pick(false); });
  $("btn-next").addEventListener("click", next);

  document.addEventListener("pl:ready", bestLine);
  PL.onLang(function () {
    bestLine();
    if (state === "game" && !answered) renderRound();
    if (state === "result") renderResult(false);
  });
})();
</script>
</body>
</html>
