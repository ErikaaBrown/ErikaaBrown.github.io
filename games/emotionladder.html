      "crumb": "Games",
      "intro.lead": "The Wheel of Emotions trains you to find the right family for a word. This ladder is the next step: knowing the family, can you find the right word among similar ones?",
      "intro.p1": "You'll see 16 rounds. Each one shows an emotion family (e.g. Anger) and 4 words. Only one truly belongs to that family; the other three belong to different families.",

<script src="../js/app.js?v=7"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var FAMILIES = ["joy", "trust", "fear", "surprise", "sadness", "disgust", "anger", "anticipation"];
  var FAM_WORDS = {
    joy:          [{pt:"Contentamento",en:"Contentment"},{pt:"Euforia",en:"Euphoria"},{pt:"Serenidade",en:"Serenity"},{pt:"Optimismo",en:"Optimism"},{pt:"Orgulho",en:"Pride"},{pt:"Entusiasmo",en:"Enthusiasm"},{pt:"Diversão",en:"Amusement"},{pt:"Alívio",en:"Relief"}],
    trust:        [{pt:"Aceitação",en:"Acceptance"},{pt:"Admiração",en:"Admiration"},{pt:"Segurança",en:"Security"},{pt:"Lealdade",en:"Loyalty"},{pt:"Ternura",en:"Tenderness"},{pt:"Devoção",en:"Devotion"},{pt:"Respeito",en:"Respect"},{pt:"Sinceridade",en:"Sincerity"}],
    fear:         [{pt:"Apreensão",en:"Apprehension"},{pt:"Pavor",en:"Terror"},{pt:"Ansiedade",en:"Anxiety"},{pt:"Insegurança",en:"Insecurity"},{pt:"Nervosismo",en:"Nervousness"},{pt:"Pânico",en:"Panic"},{pt:"Timidez",en:"Shyness"},{pt:"Alarme",en:"Alarm"}],
    surprise:     [{pt:"Espanto",en:"Amazement"},{pt:"Assombro",en:"Astonishment"},{pt:"Confusão",en:"Confusion"},{pt:"Choque",en:"Shock"},{pt:"Deslumbramento",en:"Wonder"},{pt:"Perplexidade",en:"Bewilderment"},{pt:"Distracção",en:"Distraction"},{pt:"Incredulidade",en:"Disbelief"}],
    sadness:      [{pt:"Melancolia",en:"Pensiveness"},{pt:"Desolação",en:"Grief"},{pt:"Desânimo",en:"Dejection"},{pt:"Solidão",en:"Loneliness"},{pt:"Desilusão",en:"Disappointment"},{pt:"Desamparo",en:"Helplessness"},{pt:"Nostalgia",en:"Nostalgia"},{pt:"Mágoa",en:"Sorrow"}],
    disgust:      [{pt:"Tédio",en:"Boredom"},{pt:"Repulsa",en:"Loathing"},{pt:"Desprezo",en:"Contempt"},{pt:"Rejeição",en:"Rejection"},{pt:"Enjoo",en:"Revulsion"},{pt:"Antipatia",en:"Dislike"},{pt:"Desdém",en:"Disdain"},{pt:"Escárnio",en:"Scorn"}],
    anger:        [{pt:"Irritação",en:"Annoyance"},{pt:"Fúria",en:"Rage"},{pt:"Frustração",en:"Frustration"},{pt:"Ciúme",en:"Jealousy"},{pt:"Inveja",en:"Envy"},{pt:"Indignação",en:"Indignation"},{pt:"Ressentimento",en:"Resentment"},{pt:"Impaciência",en:"Impatience"}],
    anticipation: [{pt:"Interesse",en:"Interest"},{pt:"Vigilância",en:"Vigilance"},{pt:"Curiosidade",en:"Curiosity"},{pt:"Expectativa",en:"Expectation"},{pt:"Empolgação",en:"Eagerness"},{pt:"Esperança",en:"Hope"},{pt:"Prontidão",en:"Readiness"},{pt:"Fascínio",en:"Fascination"}]
  };
  var ROUND_COUNT = 16;

  var order = [], idx = 0, score = 0, state = "intro", answered = false, roundOpts = [];

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function scores() { return PL.load("scores", {}); }

  function show(p) {
    $("panel-intro").classList.toggle("hidden", p !== "intro");
    $("panel-game").classList.toggle("hidden", p !== "game");
    $("panel-result").classList.toggle("hidden", p !== "result");
    state = p;
  }

  function bestLine() {
    var b = scores().emotionladder || 0;
    $("best-line").textContent = b ? PL.t("best.prefix") + b + "/16" : "";
  }

  function buildOrder() {
    // 2 rondas por família (16 no total), cada uma com uma palavra diferente dessa família
    var out = [];
    FAMILIES.forEach(function (fam) {
      var words = shuffled(FAM_WORDS[fam]).slice(0, 2);
      words.forEach(function (w) { out.push({ fam: fam, word: w }); });
    });
    return shuffled(out);
  }

  function optionsFor(it) {
    var otherFams = shuffled(FAMILIES.filter(function (f) { return f !== it.fam; })).slice(0, 3);
    var distractors = otherFams.map(function (f) {
      var words = FAM_WORDS[f];
      return words[Math.floor(Math.random() * words.length)];
    });
    return shuffled(distractors.concat([it.word]));
  }

  function renderRound() {
    var it = order[idx];
    answered = false;
    roundOpts = optionsFor(it);
    $("qcount").textContent = (idx + 1) + " / " + ROUND_COUNT;
    $("pfill").style.width = (idx / ROUND_COUNT * 100) + "%";
    $("feedback").classList.add("hidden");
    $("fam-prompt").textContent = PL.t("fam." + it.fam);
    var box = $("options");
    box.innerHTML = "";
    roundOpts.forEach(function (w) {
      var b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = w[PL.lang];
      b.addEventListener("click", function () { pick(w, b); });
      box.appendChild(b);
    });
  }

  function pick(word, btn) {
    if (answered) return;
    answered = true;
    var it = order[idx];
    var right = word === it.word;
    if (right) score++;
    document.querySelectorAll("#options button").forEach(function (b, i) {
      b.disabled = true;
      if (roundOpts[i] === it.word) b.classList.add("correct");
    });
    if (!right) btn.classList.add("wrong");
    var prefix = right ? PL.t("fb.right") : PL.t("fb.wrong") + "«" + it.word[PL.lang] + "». ";
    $("feedback-text").textContent = prefix;
    $("feedback").classList.remove("hidden");
  }

  function next() {
    idx++;
    if (idx >= ROUND_COUNT) {
      var sc = scores();
      var isRecord = score > (sc.emotionladder || 0);
      if (isRecord) {
        sc.emotionladder = score;
        PL.store("scores", sc);
      }
      renderResult(isRecord);
      show("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      renderRound();
    }
  }

  function renderResult(isRecord) {
    $("r-score").textContent = score;
    $("r-best").textContent = (scores().emotionladder || score) + "/16";
    var c = score >= 14 ? "res.c1" : score >= 9 ? "res.c2" : "res.c3";
    $("r-comment").textContent = (isRecord ? PL.t("new.record") + " " : "") + PL.t(c);
  }

  function start() {
    order = buildOrder();
    idx = 0; score = 0;
    show("game");
    renderRound();
  }

  $("btn-start").addEventListener("click", start);
  $("btn-again").addEventListener("click", function () {
    start();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("btn-next").addEventListener("click", next);

  document.addEventListener("pl:ready", bestLine);
  PL.onLang(function () {
    bestLine();
    if (state === "game" && !answered) renderRound();
    if (state === "result") renderResult(false);
  });
})();
</script>
