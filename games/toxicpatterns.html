    </div>
    <div class="panel panel-soft">

    </div>
    <div class="center mt-2">
      <button class="btn" id="btn-again" data-i18n="btn.again"></button>
    </div>
  </section>
</main>

<div id="site-footer"></div>

    },
    en: {
      "page.title": "Toxic Behaviours",
      "crumb": "Games",
      "intro.lead": "Selfishness, envy, manipulation, playing the victim... Can you recognise the pattern behind each situation?",
      "intro.p1": "You will read 8 everyday situations. For each one, choose, among 4 options, the toxic behaviour pattern that best describes it. Recognising the pattern is the first step to dealing with it better, whether in others or in yourself.",

      "cat.selfish": "Selfishness",

<script src="../js/app.js?v=11"></script>
<script>
(function () {
  var CATS = ["selfish", "envy", "criticism", "victim", "manipulative", "betrayal", "negative", "controlling"];

  var ITEMS = [
    { cat: "selfish",
      s: { pt: "Sempre que saem em grupo, ele/ela escolhe o restaurante, o filme e a hora, sem perguntar a mais ninguém o que prefere.", en: "Whenever the group goes out, they pick the restaurant, the film and the time, without ever asking what anyone else would prefer." } },
    { cat: "envy",
      s: { pt: "Quando contas uma boa notícia, em vez de te dar os parabéns, essa pessoa muda logo de assunto para falar de uma conquista dela.", en: "When you share good news, instead of congratulating you, this person quickly changes the subject to talk about one of their own achievements." } },
    { cat: "criticism",
      s: { pt: "Nunca dizes ou fazes nada que seja suficiente para essa pessoa: há sempre um «mas podias ter feito melhor» a seguir a qualquer coisa que partilhas.", en: "Nothing you say or do is ever quite enough for this person: there's always a \"but you could have done better\" after anything you share." } },
    { cat: "victim",
      s: { pt: "Sempre que alguém lhe pede para assumir responsabilidade por algo, essa pessoa vira a conversa para tudo o que já sofreu e como ninguém a compreende.", en: "Whenever someone asks them to take responsibility for something, this person turns the conversation to everything they've suffered and how no one understands them." } },
    { cat: "manipulative",
      s: { pt: "Depois de discutirem, essa pessoa diz que nunca disse aquilo, e que estás a exagerar ou a inventar, até começares a duvidar da tua própria memória.", en: "After an argument, this person says they never said that, and that you're exaggerating or making it up, until you start doubting your own memory." } },
    { cat: "betrayal",
      s: { pt: "Descobriste que essa pessoa partilhou um segredo teu com outras pessoas, depois de teres pedido explicitamente que não o fizesse.", en: "You found out this person shared a secret of yours with others, after you had explicitly asked them not to." } },
    { cat: "negative",
      s: { pt: "Contas-lhe que conseguiste uma promoção, e a primeira reacção dessa pessoa é listar tudo o que pode correr mal a partir de agora.", en: "You tell them you got a promotion, and their first reaction is to list everything that could go wrong from now on." } },
    { cat: "controlling",
      s: { pt: "Essa pessoa quer sempre saber onde estás, com quem, e insiste em decidir por ti até em assuntos pequenos do teu dia a dia.", en: "This person always wants to know where you are and with whom, and insists on deciding for you even in small everyday matters." } },
    { cat: "selfish",
      s: { pt: "Numa conversa a dois, essa pessoa fala sobre si durante quase todo o tempo, e raramente pergunta como estás.", en: "In a one-on-one conversation, this person talks about themselves almost the entire time, and rarely asks how you are." } },
    { cat: "envy",
      s: { pt: "Sempre que compras algo novo ou alcanças algo, essa pessoa tem de comprar ou conseguir algo «ainda melhor» pouco depois.", en: "Whenever you buy something new or achieve something, this person has to buy or achieve something \"even better\" shortly after." } },
    { cat: "manipulative",
      s: { pt: "Essa pessoa faz-te sentir culpado/a por teres limites, dizendo coisas como «se gostasses mesmo de mim, não te importarias».", en: "This person makes you feel guilty for having boundaries, saying things like \"if you really cared about me, you wouldn't mind\"." } },
    { cat: "controlling",
      s: { pt: "Essa pessoa fica visivelmente incomodada sempre que passas tempo com outros amigos, e tenta reduzir esses momentos.", en: "This person visibly bristles whenever you spend time with other friends, and tries to reduce those moments." } }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var order = [], idx = 0, score = 0, state = "intro", answered = false;

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pickRound() {
    var pool = shuffled(ITEMS);
    var used = {}, chosen = [];
    for (var i = 0; i < pool.length && chosen.length < 8; i++) {
      if (!used[pool[i].cat]) { used[pool[i].cat] = true; chosen.push(pool[i]); }
    }
    return chosen;
  }

  function scores() { return PL.load("scores", {}); }

  function show(p) {
    $("panel-intro").classList.toggle("hidden", p !== "intro");
    $("panel-game").classList.toggle("hidden", p !== "game");
    $("panel-result").classList.toggle("hidden", p !== "result");
    state = p;
  }

  function bestLine() {
    var b = scores().toxicpatterns || 0;
    $("best-line").textContent = b ? PL.t("best.prefix") + b + "/8" : "";
  }

  function optionCats(correctCat) {
    var others = CATS.filter(function (c) { return c !== correctCat; });
    var picks = shuffled(others).slice(0, 3);
    return shuffled(picks.concat([correctCat]));
  }

  function renderRound() {
    var it = order[idx];
    answered = false;
    $("qcount").textContent = (idx + 1) + " / " + order.length;
    $("pfill").style.width = (idx / order.length * 100) + "%";
    $("feedback").classList.add("hidden");
    $("situation").textContent = it.s[PL.lang];
    var box = $("options");
    box.innerHTML = "";
    var opts = optionCats(it.cat);
    opts.forEach(function (cat) {
      var b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = PL.t("cat." + cat);
      b.setAttribute("data-cat", cat);
      b.addEventListener("click", function () { pick(cat, b, it.cat); });
      box.appendChild(b);
    });
  }

  function pick(cat, btn, correctCat) {
    if (answered) return;
    answered = true;
    var right = cat === correctCat;
    if (right) score++;
    document.querySelectorAll("#options button").forEach(function (b) {
      if (b.getAttribute("data-cat") === correctCat) b.classList.add("correct");
    });
    if (!right) btn.classList.add("wrong");
    var prefix = right ? PL.t("fb.right") : PL.t("fb.wrong") + PL.t("cat." + correctCat) + PL.t("fb.wrong2");
    $("feedback-text").textContent = prefix;
    $("feedback").classList.remove("hidden");
  }

  function next() {
    idx++;
    if (idx >= order.length) {
      var sc = scores();
      var isRecord = score > (sc.toxicpatterns || 0);
      if (isRecord) {
        sc.toxicpatterns = score;
        PL.store("scores", sc);
      }
      renderResult(isRecord);
      show("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      renderRound();
    }
  }

  function renderResult(isRecord) {
    $("r-score").textContent = score;
    $("r-best").textContent = (scores().toxicpatterns || score) + "/8";
    var c = score >= 7 ? "res.c1" : score >= 4 ? "res.c2" : "res.c3";
    $("r-comment").textContent = (isRecord ? PL.t("new.record") + " " : "") + PL.t(c);
  }

  function start() {
    order = pickRound();
    idx = 0; score = 0;
    show("game");
    renderRound();
  }

  $("btn-start").addEventListener("click", start);
  $("btn-again").addEventListener("click", function () {
    start();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("btn-next").addEventListener("click", next);

  document.addEventListener("pl:ready", bestLine);
  PL.onLang(function () {
    bestLine();
    if (state === "game" && !answered) renderRound();
    if (state === "result") renderResult(false);
  });
})();
</script>
</body>
</html>
