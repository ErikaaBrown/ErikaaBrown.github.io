<script src="../js/app.js?v=7"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var FAMILIES = ["joy", "trust", "fear", "surprise", "sadness", "disgust", "anger", "anticipation"];
  var FAM_EMOJI = { joy: "😊", trust: "🤝", fear: "😨", surprise: "😲", sadness: "😢", disgust: "🤢", anger: "😠", anticipation: "🤔" };
  var FAM_WORDS = {
    joy:          [{pt:"Contentamento",en:"Contentment"},{pt:"Euforia",en:"Euphoria"},{pt:"Serenidade",en:"Serenity"},{pt:"Optimismo",en:"Optimism"},{pt:"Orgulho",en:"Pride"},{pt:"Entusiasmo",en:"Enthusiasm"},{pt:"Diversão",en:"Amusement"},{pt:"Alívio",en:"Relief"}],
    trust:        [{pt:"Aceitação",en:"Acceptance"},{pt:"Admiração",en:"Admiration"},{pt:"Segurança",en:"Security"},{pt:"Lealdade",en:"Loyalty"},{pt:"Ternura",en:"Tenderness"},{pt:"Devoção",en:"Devotion"},{pt:"Respeito",en:"Respect"},{pt:"Sinceridade",en:"Sincerity"}],
    fear:         [{pt:"Apreensão",en:"Apprehension"},{pt:"Pavor",en:"Terror"},{pt:"Ansiedade",en:"Anxiety"},{pt:"Insegurança",en:"Insecurity"},{pt:"Nervosismo",en:"Nervousness"},{pt:"Pânico",en:"Panic"},{pt:"Timidez",en:"Shyness"},{pt:"Alarme",en:"Alarm"}],
    surprise:     [{pt:"Espanto",en:"Amazement"},{pt:"Assombro",en:"Astonishment"},{pt:"Confusão",en:"Confusion"},{pt:"Choque",en:"Shock"},{pt:"Deslumbramento",en:"Wonder"},{pt:"Perplexidade",en:"Bewilderment"},{pt:"Distracção",en:"Distraction"},{pt:"Incredulidade",en:"Disbelief"}],
    sadness:      [{pt:"Melancolia",en:"Pensiveness"},{pt:"Desolação",en:"Grief"},{pt:"Desânimo",en:"Dejection"},{pt:"Solidão",en:"Loneliness"},{pt:"Desilusão",en:"Disappointment"},{pt:"Desamparo",en:"Helplessness"},{pt:"Nostalgia",en:"Nostalgia"},{pt:"Mágoa",en:"Sorrow"}],
    disgust:      [{pt:"Tédio",en:"Boredom"},{pt:"Repulsa",en:"Loathing"},{pt:"Desprezo",en:"Contempt"},{pt:"Rejeição",en:"Rejection"},{pt:"Enjoo",en:"Revulsion"},{pt:"Antipatia",en:"Dislike"},{pt:"Desdém",en:"Disdain"},{pt:"Escárnio",en:"Scorn"}],
    anger:        [{pt:"Irritação",en:"Annoyance"},{pt:"Fúria",en:"Rage"},{pt:"Frustração",en:"Frustration"},{pt:"Ciúme",en:"Jealousy"},{pt:"Inveja",en:"Envy"},{pt:"Indignação",en:"Indignation"},{pt:"Ressentimento",en:"Resentment"},{pt:"Impaciência",en:"Impatience"}],
    anticipation: [{pt:"Interesse",en:"Interest"},{pt:"Vigilância",en:"Vigilance"},{pt:"Curiosidade",en:"Curiosity"},{pt:"Expectativa",en:"Expectation"},{pt:"Empolgação",en:"Excitement"},{pt:"Esperança",en:"Hope"},{pt:"Prontidão",en:"Readiness"},{pt:"Fascínio",en:"Fascination"}]
  };

  var current = null;

  function renderFamRow() {
    var box = $("fam-row");
    box.innerHTML = "";
    FAMILIES.forEach(function (fam) {
      var b = document.createElement("button");
      b.className = "tag-btn" + (fam === current ? " sel" : "");
      b.textContent = FAM_EMOJI[fam] + " " + PL.t("fam." + fam);
      b.addEventListener("click", function () {
        current = current === fam ? null : fam;
        render();
      });
      box.appendChild(b);
    });
  }

  function renderWords() {
    var el = $("fam-words");
    if (!current) { el.classList.add("hidden"); el.innerHTML = ""; return; }
    el.classList.remove("hidden");
    var words = FAM_WORDS[current];
    el.innerHTML = "<div class='tag-row'>" + words.map(function (w) {
      return "<span class='tag-btn' style='cursor:default'>" + PL.esc(w[PL.lang]) + "</span>";
    }).join("") + "</div>";
  }

  function render() {
    renderFamRow();
    renderWords();
  }

  document.addEventListener("pl:ready", render);
  PL.onLang(render);
})();
</script>
</body>
</html>
