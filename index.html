<script src="js/app.js?v=11"></script>
<script>
(function () {
  var KEY = "pl_dismissed_whatsnew_2026_09b";
  var banner = document.getElementById("whatsnew-banner");
  if (localStorage.getItem(KEY)) banner.classList.add("hidden");
  document.getElementById("whatsnew-close").addEventListener("click", function () {
    localStorage.setItem(KEY, "1");
    banner.classList.add("hidden");
  });
})();

(function () {
  var TEST_PAGES = {
    bigfive: "tests/big-five.html", attachment: "tests/attachment.html", eq: "tests/eq.html",
    stress: "tests/stress.html", rosenberg: "tests/rosenberg.html", resilience: "tests/resilience.html",
    panas: "tests/panas.html", selfcompassion: "tests/selfcompassion.html",
    assertiveness: "tests/assertiveness.html", gratefulness: "tests/gratefulness.html",
    communication: "tests/communication.html", perfectionism: "tests/perfectionism.html"
  };

  function latestDateMap(key) {
    var obj = PL.load(key, {});
    var keys = Object.keys(obj || {});
    if (!keys.length) return null;
    keys.sort();
    var d = keys[keys.length - 1];
    return { date: d, raw: obj[d] };
  }
  function latestArray(key) {
    var arr = PL.load(key, []);
    if (!Array.isArray(arr) || !arr.length) return null;
    var last = arr[arr.length - 1];
    if (!last || !last.date) return null;
    return { date: last.date, raw: last };
  }
  function fill(tmpl, vals) {
    return Object.keys(vals).reduce(function (s, k) {
      return s.replace("{" + k + "}", vals[k]);
    }, tmpl);
  }

  function buildCandidates() {
    var list = [];
    var m = latestDateMap("mood");
    if (m && m.raw && typeof m.raw.m === "number") {
      list.push({ date: m.date, href: "tools/mood.html", cat: PL.t("continue.cat.mood"),
        line: fill(PL.t("continue.mood.line"), { d: PL.fmtDate(m.date), v: m.raw.m }) });
    }
    var g = latestDateMap("gratitude");
    if (g) {
      var n = Array.isArray(g.raw) ? g.raw.filter(Boolean).length : 0;
      list.push({ date: g.date, href: "tools/gratitude.html", cat: PL.t("continue.cat.gratitude"),
        line: fill(PL.t("continue.gratitude.line"), { d: PL.fmtDate(g.date), v: n }) });
    }
    var s = latestDateMap("sleep");
    if (s && s.raw && typeof s.raw.q === "number") {
      list.push({ date: s.date, href: "tools/sleep.html", cat: PL.t("continue.cat.sleep"),
        line: fill(PL.t("continue.sleep.line"), { d: PL.fmtDate(s.date), v: s.raw.q }) });
    }
    var v = latestArray("values");
    if (v) {
      list.push({ date: v.date, href: "tools/values.html", cat: PL.t("continue.cat.values"),
        line: fill(PL.t("continue.values.line"), { n: v.raw.n, d: PL.fmtDate(v.date) }) });
    }
    var lw = latestArray("lifewheel");
    if (lw && lw.raw.scores) {
      var lwKeys = Object.keys(lw.raw.scores).filter(function (k) { return typeof lw.raw.scores[k] === "number"; });
      if (lwKeys.length) {
        var lwAvg = Math.round((lwKeys.reduce(function (s, k) { return s + lw.raw.scores[k]; }, 0) / lwKeys.length) * 10) / 10;
        list.push({ date: lw.date, href: "tools/lifewheel.html", cat: PL.t("continue.cat.lifewheel"),
          line: fill(PL.t("continue.lifewheel.line"), { d: PL.fmtDate(lw.date), v: lwAvg }) });
      }
    }
    var tr = latestArray("test_results");
    if (tr && TEST_PAGES[tr.raw.test]) {
      list.push({ date: tr.date, href: TEST_PAGES[tr.raw.test], cat: PL.t("test." + tr.raw.test),
        line: fill(PL.t("continue.test.line"), { d: PL.fmtDate(tr.date) }) });
    }
    list.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    return list.slice(0, 3);
  }

  function renderContinue() {
    var wrap = document.getElementById("hub-continue");
    var row = document.getElementById("hub-continue-row");
    var items = buildCandidates();
    if (!items.length) {
      wrap.classList.add("hidden");
      row.innerHTML = "";
      return;
    }
    wrap.classList.remove("hidden");
    row.innerHTML = items.map(function (it) {
      return "<a class=\"hub-continue-card\" href=\"" + it.href + "\">" +
        "<div class=\"cline\">" + PL.esc(it.cat) + "</div>" +
        "<h3>" + PL.esc(it.line) + "</h3></a>";
    }).join("");
  }

  var searchInput = document.getElementById("hub-search");
  var emptyNote = document.getElementById("hub-empty");

  function applySearchFilter() {
    var q = searchInput.value.trim().toLowerCase();
    var anyVisible = false;
    document.querySelectorAll("main.container > section[id]").forEach(function (section) {
      if (section.id === "hub-continue") return;
      var sel = section.querySelector(".hub-chips .tag-btn.sel");
      var activeFilter = sel ? sel.dataset.filter : "all";
      var sectionVisible = false;
      section.querySelectorAll(".subgroup, .subgroup-acc").forEach(function (group) {
        var groupMatchesFilter = activeFilter === "all" || activeFilter === group.dataset.group;
        var groupVisible = false;
        group.querySelectorAll(".card").forEach(function (card) {
          var text = PL.lang === "en" ? card.dataset.searchEn : card.dataset.searchPt;
          var matchesSearch = !q || (text || "").indexOf(q) !== -1;
          var visible = groupMatchesFilter && matchesSearch;
          card.classList.toggle("hidden", !visible);
          if (visible) groupVisible = true;
        });
        group.classList.toggle("hidden", !groupVisible);
        if (groupVisible && "open" in group && (q || activeFilter !== "all")) group.open = true;
        if (groupVisible) sectionVisible = true;
      });
      if (sectionVisible) anyVisible = true;
    });
    emptyNote.classList.toggle("show", !anyVisible);
  }

  document.querySelectorAll(".hub-chips").forEach(function (row) {
    row.querySelectorAll(".tag-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        row.querySelectorAll(".tag-btn").forEach(function (b) { b.classList.remove("sel"); });
        btn.classList.add("sel");
        applySearchFilter();
      });
    });
  });
  searchInput.addEventListener("input", applySearchFilter);

  function initHub() {
    renderContinue();
    applySearchFilter();
  }
  document.addEventListener("pl:ready", initHub);
  PL.onLang(initHub);
})();
</script>
