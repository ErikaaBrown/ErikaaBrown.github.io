<body>

    <p data-i18n="intro.lead"></p>

  <section class="panel">

    <label class="field-label" for="f-activity" data-i18n="add.label1"></label>
    <input type="text" id="f-activity" data-i18n-ph="add.ph1" maxlength="120">
    <label class="field-label" data-i18n="add.label2"></label>
    <div class="tag-row">
      <button type="button" class="tag-btn" id="btn-vitamin">🌱 <span data-i18n="tag.vitamin"></span></button>
      <button type="button" class="tag-btn" id="btn-toxin">🌧️ <span data-i18n="tag.toxin"></span></button>
    </div>
    <label class="field-label" for="f-note" data-i18n="add.label3"></label>
    <textarea id="f-note" rows="2" data-i18n-ph="add.ph3"></textarea>
    <div class="center mt-2">
      <button class="btn" id="btn-add" data-i18n="btn.add"></button>
    </div>
  </section>

  <section>
    <h2 data-i18n="list.title"></h2>
    <div class="vt-tally" id="tally"></div>
    <div class="vt-bar" id="vt-bar"></div>
    <p class="small muted" style="margin-top:20px" id="count-line"></p>
    <div id="entry-list"></div>
    <p class="small muted hidden" id="list-empty" data-i18n="list.empty"></p>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "tools",
  i18n: {

      "crumb": "Ferramentas",
      "intro.lead": "Nem todas as actividades te fazem bem da mesma forma: umas energizam-te (Vitamina), outras esgotam-te (Toxina).",

      "add.title": "Registar uma actividade",

      "added": "Registado 🌿",

      "list.title": "O teu registo",
      "list.empty": "Ainda não registaste nada. Começa em cima.",
      "tally.vitamin": "Vitamina", "tally.toxin": "Toxina",
      "del.confirm": "Remover este registo?"
    },
    en: {
      "page.title": "Self-Care Log",
      "crumb": "Tools",
      "intro.lead": "Not every activity does you good the same way: some energise you (Vitamin), others drain you (Toxin).",
      "how.p": "💡 How it works: whenever you do something that energises you or something that drains you, log it here. Over time you'll build your own list of Vitamin activities, and get a clearer sense of when days carry more Toxin than you'd like.",

      "list.title": "Your log",
      "list.empty": "You haven't logged anything yet. Start above.",

      "del.confirm": "Remove this entry?"
    }
  }

<script src="../js/app.js?v=11"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var entries = PL.load("selfcarelog", []);
  var picked = "";

  function save() { PL.store("selfcarelog", entries); }

  function renderPicker() {
    $("btn-vitamin").classList.toggle("sel", picked === "vitamin");
    $("btn-toxin").classList.toggle("sel", picked === "toxin");
  }

  function renderTally() {
    var vit = entries.filter(function (e) { return e.tag === "vitamin"; }).length;
    var tox = entries.filter(function (e) { return e.tag === "toxin"; }).length;
    var total = vit + tox;
    $("tally").innerHTML =
      "<div class='vt-tile'><div class='num' style='color:var(--good)'>" + vit + "</div><div class='lbl'>🌱 " + PL.t("tally.vitamin") + "</div></div>" +
      "<div class='vt-tile'><div class='num' style='color:var(--serious)'>" + tox + "</div><div class='lbl'>🌧️ " + PL.t("tally.toxin") + "</div></div>";
    var vitPct = total ? Math.round((vit / total) * 100) : 50;
    $("vt-bar").innerHTML = "<span style='width:" + vitPct + "%;background:var(--good)'></span><span style='width:" + (100 - vitPct) + "%;background:var(--serious)'></span>";
  }

  function renderCount() {
    $("count-line").textContent = entries.length;
  }

  function renderList() {
    var box = $("entry-list");
    box.innerHTML = "";
    entries.slice().reverse().forEach(function (e) {
      var idx = entries.indexOf(e);
      var div = document.createElement("div");
      div.className = "entry";
      var tagChip = e.tag === "vitamin" ? "<span class='chip' style='color:var(--good)'>🌱 " + PL.t("tally.vitamin") + "</span>" : "<span class='chip' style='color:var(--serious)'>🌧️ " + PL.t("tally.toxin") + "</span>";
      div.innerHTML =
        "<div class='entry-head'><span class='entry-date'>" + PL.fmtDate(e.added) + "</span>" + tagChip +
        "<button class='del' data-del='" + idx + "'>🗑️</button></div>" +
        "<p style='margin:8px 0 0'><strong>" + PL.esc(e.activity) + "</strong></p>" +
        (e.note ? "<p class='small muted' style='margin:4px 0 0'>" + PL.esc(e.note) + "</p>" : "");
      box.appendChild(div);
    });
    $("list-empty").classList.toggle("hidden", entries.length > 0);
    box.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (confirm(PL.t("del.confirm"))) {
          entries.splice(parseInt(b.getAttribute("data-del"), 10), 1);
          save();
          renderAll();
        }
      });
    });
  }

  function renderAll() { renderPicker(); renderTally(); renderCount(); renderList(); }

  $("btn-vitamin").addEventListener("click", function () { picked = "vitamin"; renderPicker(); });
  $("btn-toxin").addEventListener("click", function () { picked = "toxin"; renderPicker(); });

  $("btn-add").addEventListener("click", function () {
    var activity = $("f-activity").value.trim();
    if (!activity || !picked) { PL.toast(PL.t("empty.req")); return; }
    entries.push({ activity: activity, tag: picked, note: $("f-note").value.trim(), added: PL.todayISO() });
    save();
    $("f-activity").value = "";
    $("f-note").value = "";
    picked = "";
    PL.toast(PL.t("added"));
    renderAll();
  });

  document.addEventListener("pl:ready", renderAll);
  PL.onLang(renderAll);
})();
</script>
</body>
</html>
