<script>

  i18n: {

      "btn.start": "Começar",

      "res.title": "Os teus 5 valores fundamentais",
      "res.expl": "🧭 Guarda isto para releres em momentos de dúvida ou de decisão difícil: quando uma escolha se alinha com estes valores, costuma sentir-se mais certa, mesmo que seja mais difícil.",

    },
    en: {
      "page.title": "Values Hierarchy",
      "crumb": "Tools",
      "intro.lead": "A classic values-clarification exercise: from a big list, you narrow down, step by step, until only the values that define you most remain.",

      "btn.start": "Start",
      "btn.next": "Next →",
      "btn.again": "Do it again",

      "pick.title.10": "Step 2 of 3: narrow to 10",
      "pick.title.5": "Step 3 of 3: narrow to 5",

<script src="../js/app.js?v=7"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var POOL = [
    { pt: "Amizade", en: "Friendship" }, { pt: "Amor", en: "Love" }, { pt: "Família", en: "Family" },
    { pt: "Saúde", en: "Health" }, { pt: "Liberdade", en: "Freedom" }, { pt: "Honestidade", en: "Honesty" },
    { pt: "Justiça", en: "Justice" }, { pt: "Segurança", en: "Security" }, { pt: "Aventura", en: "Adventure" },
    { pt: "Criatividade", en: "Creativity" }, { pt: "Aprendizagem", en: "Learning" }, { pt: "Autonomia", en: "Autonomy" },
    { pt: "Compaixão", en: "Compassion" }, { pt: "Coragem", en: "Courage" }, { pt: "Equilíbrio", en: "Balance" },
    { pt: "Espiritualidade", en: "Spirituality" }, { pt: "Excelência", en: "Excellence" }, { pt: "Generosidade", en: "Generosity" },
    { pt: "Gratidão", en: "Gratitude" }, { pt: "Humildade", en: "Humility" }, { pt: "Humor", en: "Humour" },
    { pt: "Independência", en: "Independence" }, { pt: "Lealdade", en: "Loyalty" }, { pt: "Ordem", en: "Order" },
    { pt: "Paz", en: "Peace" }, { pt: "Perdão", en: "Forgiveness" }, { pt: "Reconhecimento", en: "Recognition" },
    { pt: "Respeito", en: "Respect" }, { pt: "Responsabilidade", en: "Responsibility" }, { pt: "Sabedoria", en: "Wisdom" },
    { pt: "Simplicidade", en: "Simplicity" }, { pt: "Sinceridade", en: "Sincerity" }, { pt: "Sucesso", en: "Success" },
    { pt: "Sustentabilidade", en: "Sustainability" }, { pt: "Tradição", en: "Tradition" }, { pt: "Confiança", en: "Trust" },
    { pt: "Tolerância", en: "Tolerance" }, { pt: "Curiosidade", en: "Curiosity" }, { pt: "Diversão", en: "Fun" },
    { pt: "Beleza", en: "Beauty" }, { pt: "Colaboração", en: "Collaboration" }, { pt: "Autenticidade", en: "Authenticity" }
  ];

  var state = "intro";
  var candidates = [], picking = [], pickTarget = 0, sel10 = [];

  function show(p) {
    $("panel-intro").classList.toggle("hidden", p !== "intro");
    $("panel-pick").classList.toggle("hidden", p !== "pick");
    $("panel-result").classList.toggle("hidden", p !== "result");
    state = p;
  }

  function renderPicker() {
    $("pick-title").textContent = PL.t("pick.title." + pickTarget);
    var box = $("pick-grid");
    box.innerHTML = "";
    candidates.forEach(function (i) {
      var b = document.createElement("button");
      var isSel = picking.indexOf(i) >= 0;
      b.className = "tag-btn" + (isSel ? " sel" : "");
      b.textContent = POOL[i][PL.lang];
      b.disabled = !isSel && picking.length >= pickTarget;
      b.addEventListener("click", function () {
        var p = picking.indexOf(i);
        if (p >= 0) picking.splice(p, 1);
        else if (picking.length < pickTarget) picking.push(i);
        renderPicker();
      });
      box.appendChild(b);
    });
    $("pick-count").textContent = picking.length + " / " + pickTarget;
    $("btn-pick-next").disabled = picking.length !== pickTarget;
    $("pfill").style.width = (pickTarget === 15 ? 0 : pickTarget === 10 ? 33 : 66) + "%";
  }

  function startPick(cands, target) {
    candidates = cands.slice();
    pickTarget = target;
    picking = [];
    show("pick");
    renderPicker();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function saveRun(top10, top5) {
    var history = PL.load("values", []);
    history.push({ n: history.length + 1, date: PL.todayISO(), top10: top10.slice(), top5: top5.slice() });
    PL.store("values", history);
    renderHistory();
  }

  function renderResult(top5) {
    var box = $("result-words");
    box.innerHTML = top5.map(function (i) {
      return "<span class='tag-btn sel' style='cursor:default'>" + PL.esc(POOL[i][PL.lang]) + "</span>";
    }).join("");
  }

  function renderHistory() {
    var history = PL.load("values", []);
    var box = $("history-list");
    box.innerHTML = "";
    history.slice().reverse().forEach(function (e) {
      var idx = history.indexOf(e);
      var words = e.top5.map(function (i) { return POOL[i] ? POOL[i][PL.lang] : "?"; }).join(", ");
      var div = document.createElement("div");
      div.className = "entry";
      div.innerHTML =
        "<div class='entry-head'><span class='entry-date'>#" + e.n + " · " + PL.fmtDate(e.date) + "</span>" +
        "<button class='del' data-del='" + idx + "'>🗑️</button></div>" +
        "<p style='margin:8px 0 0'>" + PL.esc(words) + "</p>";
      box.appendChild(div);
    });
    $("history-empty").classList.toggle("hidden", history.length > 0);
    document.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!confirm(PL.t("del.confirm"))) return;
        var h = PL.load("values", []);
        h.splice(parseInt(b.getAttribute("data-del"), 10), 1);
        PL.store("values", h);
        renderHistory();
      });
    });
  }

  $("btn-start").addEventListener("click", function () {
    startPick(POOL.map(function (_, i) { return i; }), 15);
  });

  $("btn-pick-next").addEventListener("click", function () {
    if (pickTarget === 15) {
      startPick(picking, 10);
    } else if (pickTarget === 10) {
      sel10 = picking.slice();
      startPick(picking, 5);
    } else {
      saveRun(sel10, picking);
      renderResult(picking);
      show("result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  $("btn-again").addEventListener("click", function () {
    startPick(POOL.map(function (_, i) { return i; }), 15);
  });

  document.addEventListener("pl:ready", renderHistory);
  PL.onLang(function () {
    renderHistory();
    if (state === "pick") renderPicker();
    if (state === "result") renderResult(picking);
  });
})();
</script>
</body>
</html>
