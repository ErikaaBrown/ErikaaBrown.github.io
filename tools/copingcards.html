<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "tools",
  i18n: {

      "page.title": "Cartões de Enfrentamento",
      "crumb": "Ferramentas",
      "intro.lead": "Uma técnica clássica da terapia cognitivo-comportamental: escreve, com calma, frases que te ajudam nos momentos difíceis, para as teres à mão precisamente quando mais precisas delas.",

      "btn.draw": "🎴 Preciso de uma agora",
      "draw.empty": "Ainda não tens cartões guardados. Escreve o primeiro em baixo.",
      "add.title": "Escrever um cartão novo",
      "add.label1": "Para que situação é este cartão? (opcional)",
      "add.ph1": "ex.: Antes de falar em público",
      "add.label2": "A frase que te ajuda",
      "add.ph2": "ex.: Já ultrapassei isto antes. O nervosismo é desconforto, não perigo.",
      "btn.add": "Guardar cartão",
      "added": "Cartão guardado 🌿",
      "empty.req": "Escreve primeiro a frase do cartão",
      "list.title": "Os teus cartões",
      "list.empty": "Ainda não há cartões guardados.",
      "count.n": " cartões guardados",
      "count.1": " cartão guardado",
      "del.confirm": "Apagar este cartão?"
    },
    en: {
      "page.title": "Coping Cards",
      "crumb": "Tools",
      "intro.lead": "A classic cognitive-behavioural therapy technique: calmly write down phrases that help you through hard moments, so you have them ready exactly when you need them.",

      "add.ph2": "e.g.: I've gotten through this before. Nervousness is discomfort, not danger.",
      "btn.add": "Save card",
      "added": "Card saved 🌿",
      "empty.req": "Write the card's phrase first",
      "list.title": "Your cards",
      "list.empty": "No cards saved yet.",

<script src="../js/app.js?v=7"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cards = PL.load("copingcards", []);

  function save() { PL.store("copingcards", cards); }

  function renderCount() {
    var n = cards.length;
    $("count-line").textContent = n === 1 ? "1" + PL.t("count.1") : n + PL.t("count.n");
  }

  function renderList() {
    var box = $("card-list");
    box.innerHTML = "";
    cards.slice().reverse().forEach(function (c) {
      var idx = cards.indexOf(c);
      var div = document.createElement("div");
      div.className = "entry";
      var head = c.situation
        ? "<span class='entry-date'>" + PL.esc(c.situation) + "</span>"
        : "<span class='entry-date'>" + PL.fmtDate(c.added) + "</span>";
      div.innerHTML =
        "<div class='entry-head'>" + head +
        "<button class='del' data-del='" + idx + "'>🗑️</button></div>" +
        "<p style='margin:8px 0 0'>" + PL.esc(c.text) + "</p>";
      box.appendChild(div);
    });
    $("list-empty").classList.toggle("hidden", cards.length > 0);
    document.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (confirm(PL.t("del.confirm"))) {
          cards.splice(parseInt(b.getAttribute("data-del"), 10), 1);
          save();
          renderAll();
        }
      });
    });
  }

  function renderAll() { renderCount(); renderList(); }

  $("btn-add").addEventListener("click", function () {
    var text = $("f-card").value.trim();
    if (!text) { PL.toast(PL.t("empty.req")); return; }
    var situation = $("f-situation").value.trim();
    cards.push({ situation: situation, text: text, added: PL.todayISO() });
    save();
    $("f-card").value = "";
    $("f-situation").value = "";
    PL.toast(PL.t("added"));
    renderAll();
  });

  $("btn-draw").addEventListener("click", function () {
    if (!cards.length) {
      $("draw-empty").classList.remove("hidden");
      $("drawn").classList.add("hidden");
      return;
    }
    $("draw-empty").classList.add("hidden");
    var c = cards[Math.floor(Math.random() * cards.length)];
    var label = c.situation ? "<strong>" + PL.esc(c.situation) + "</strong><br>" : "";
    $("drawn-text").innerHTML = label + PL.esc(c.text);
    $("drawn").classList.remove("hidden");
  });

  document.addEventListener("pl:ready", renderAll);
  PL.onLang(renderAll);
})();
</script>
</body>
</html>
