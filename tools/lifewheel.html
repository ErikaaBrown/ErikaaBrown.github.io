<style>
  .wheel-wrap { max-width: 560px; margin: 0 auto; }
  .wheel-wrap svg { width: 100%; height: auto; display: block; }
  .wheel-ring { cursor: pointer; transition: fill-opacity 0.12s; }
  .wheel-ring:hover { stroke: var(--ink-2); stroke-width: 2; }
  .wheel-label div { font-size: 0.78rem; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .wheel-label .score { font-weight: 800; font-variant-numeric: tabular-nums; }
  .wheel-center-num { font-family: var(--font-display); font-weight: 700; fill: var(--ink); }
  .wheel-center-lbl { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
  .quad-legend { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: center; margin: 18px 0 6px; }
  .quad-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-2); font-weight: 700; }
  .quad-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .avg-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 22px 0 6px; }
  .avg-tile { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; text-align: center; }
  .avg-tile .num { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
  .avg-tile .lbl { font-size: 0.76rem; color: var(--ink-2); margin-top: 2px; }
  .lowest-list { margin: 10px 0 0; padding-left: 20px; }
  .goal-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .goal-card h3 { margin: 0 0 12px; font-size: 1.05rem; }
  .goal-field { margin-bottom: 12px; }
  .goal-field label { display: block; font-weight: 800; font-size: 0.86rem; margin-bottom: 4px; }
  .goal-field .hint { display: block; font-weight: 400; color: var(--ink-3); font-size: 0.78rem; margin-top: 2px; }
</style>

<script src="../js/app.js?v=11"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var AREAS = ["saude", "intelectual", "emocional", "realizacao", "financeiro", "contribuicao",
    "familia", "amoroso", "social", "hobbies", "plenitude", "espiritualidade"];
  var QUADRANTS = [
    { key: "pessoal", cssVar: "--brand", areas: ["saude", "intelectual", "emocional"] },
    { key: "profissional", cssVar: "--clay", areas: ["realizacao", "financeiro", "contribuicao"] },
    { key: "relacionamentos", cssVar: "--accent", areas: ["familia", "amoroso", "social"] },
    { key: "qualidade", cssVar: "--plum", areas: ["hobbies", "plenitude", "espiritualidade"] }
  ];
  function quadrantOf(area) {
    for (var i = 0; i < QUADRANTS.length; i++) if (QUADRANTS[i].areas.indexOf(area) >= 0) return QUADRANTS[i];
    return null;
  }

  var CX = 280, CY = 280, INNER_R = 55, OUTER_R = 210, LEVELS = 10;
  var RING_W = (OUTER_R - INNER_R) / LEVELS;
  var SLICE_DEG = 360 / AREAS.length;

  function polar(angleDeg, r) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: CX + r * Math.cos(rad), y: CY + r * Math.sin(rad) };
  }
  function annularPath(r0, r1, a0, a1) {
    var p0 = polar(a0, r1), p1 = polar(a1, r1), p2 = polar(a1, r0), p3 = polar(a0, r0);
    return "M " + p0.x.toFixed(2) + " " + p0.y.toFixed(2) +
      " A " + r1 + " " + r1 + " 0 0 1 " + p1.x.toFixed(2) + " " + p1.y.toFixed(2) +
      " L " + p2.x.toFixed(2) + " " + p2.y.toFixed(2) +
      " A " + r0 + " " + r0 + " 0 0 0 " + p3.x.toFixed(2) + " " + p3.y.toFixed(2) + " Z";
  }

  var state = "intro";
  var scores = {};
  var reflectWhy = "", investAreas = [], habits = "", habitsChange = "";
  var goals = {};

  function show(p) {
    ["intro", "wheel", "reflect", "goals", "result"].forEach(function (name) {
      $("panel-" + name).classList.toggle("hidden", p !== name);
    });
    state = p;
  }

  function avgOf(areaList) {
    var vals = areaList.map(function (a) { return scores[a]; }).filter(function (v) { return typeof v === "number"; });
    if (!vals.length) return null;
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  }
  function fmt1(n) { return n === null ? "-" : (Math.round(n * 10) / 10).toString().replace(".", ","); }

  function renderWheel() {
    var svg = ['<svg viewBox="0 0 560 560" role="img" aria-label="' + PL.esc(PL.t("wheel.title")) + '">'];
    AREAS.forEach(function (area, i) {
      var quad = quadrantOf(area);
      var a0 = i * SLICE_DEG, a1 = (i + 1) * SLICE_DEG;
      var current = scores[area] || 0;
      for (var lvl = 1; lvl <= LEVELS; lvl++) {
        var r0 = INNER_R + (lvl - 1) * RING_W, r1 = INNER_R + lvl * RING_W;
        var filled = lvl <= current;
        var opacity = filled ? (0.28 + lvl * 0.072).toFixed(3) : 0;
        var fill = filled ? "var(" + quad.cssVar + ")" : "var(--surface-2)";
        svg.push('<path class="wheel-ring" data-area="' + area + '" data-level="' + lvl + '" d="' +
          annularPath(r0, r1, a0, a1) + '" fill="' + fill + '" fill-opacity="' + (filled ? opacity : 1) +
          '" stroke="var(--surface)" stroke-width="1.5"></path>');
      }
    });
    svg.push('<circle cx="' + CX + '" cy="' + CY + '" r="' + (INNER_R - 4) + '" fill="var(--surface)"></circle>');
    var overall = avgOf(AREAS);
    svg.push('<text x="' + CX + '" y="' + (CY - 4) + '" text-anchor="middle" class="wheel-center-num" font-size="30">' + fmt1(overall) + '</text>');
    svg.push('<text x="' + CX + '" y="' + (CY + 18) + '" text-anchor="middle" class="wheel-center-lbl">' + PL.esc(PL.t("avg.overall")) + '</text>');
    svg.push("</svg>");
    $("wheel-svg-wrap").innerHTML = svg.join("");

    var labelsHtml = AREAS.map(function (area, i) {
      var mid = i * SLICE_DEG + SLICE_DEG / 2;
      var pos = polar(mid, OUTER_R + 14);
      var rightSide = mid > 0 && mid < 180;
      var boxW = 132;
      var x = rightSide ? pos.x : pos.x - boxW;
      var val = scores[area] ? scores[area] + "/10" : "-";
      return "<div class='wheel-label' style='position:absolute;left:" + ((x / 560) * 100).toFixed(2) + "%;top:" + ((pos.y / 560) * 100).toFixed(2) +
        "%;width:" + ((boxW / 560) * 100).toFixed(2) + "%;transform:translateY(-50%);text-align:" + (rightSide ? "left" : "right") + "'>" +
        "<div>" + PL.esc(PL.t("area." + area)) + "<br><span class='score'>" + val + "</span></div></div>";
    }).join("");
    var wrap = $("wheel-svg-wrap");
    wrap.style.position = "relative";
    var overlay = document.createElement("div");
    overlay.style.cssText = "position:absolute;inset:0;pointer-events:none";
    overlay.innerHTML = labelsHtml;
    wrap.appendChild(overlay);

    wrap.querySelectorAll(".wheel-ring").forEach(function (path) {
      path.addEventListener("click", function () {
        var area = path.getAttribute("data-area");
        var level = parseInt(path.getAttribute("data-level"), 10);
        scores[area] = level;
        renderWheel();
        renderAverages();
        checkWheelComplete();
      });
    });
  }

  function renderLegend() {
    $("quad-legend").innerHTML = QUADRANTS.map(function (q) {
      return "<span><i style='background:var(" + q.cssVar + ")'></i>" + PL.esc(PL.t("quad." + q.key)) + "</span>";
    }).join("");
  }

  function renderAverages() {
    $("avg-row").innerHTML = QUADRANTS.map(function (q) {
      return "<div class='avg-tile'><div class='num' style='color:var(" + q.cssVar + ")'>" + fmt1(avgOf(q.areas)) + "</div>" +
        "<div class='lbl'>" + PL.esc(PL.t("quad." + q.key)) + "</div></div>";
    }).join("");
  }

  function checkWheelComplete() {
    var done = AREAS.every(function (a) { return typeof scores[a] === "number"; });
    $("btn-wheel-next").disabled = !done;
  }

  function renderReflect() {
    var sorted = AREAS.slice().sort(function (a, b) { return scores[a] - scores[b]; });
    var minScore = scores[sorted[0]];
    var lowest = sorted.filter(function (a) { return scores[a] === minScore; });
    $("lowest-list").innerHTML = lowest.map(function (a) {
      return "<li>" + PL.esc(PL.t("area." + a)) + " (" + scores[a] + "/10)</li>";
    }).join("");

    var investCandidates = AREAS.filter(function (a) { return scores[a] < 10; });
    var grid = $("invest-grid");
    grid.innerHTML = "";
    investCandidates.forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tag-btn" + (investAreas.indexOf(a) >= 0 ? " sel" : "");
      b.textContent = PL.t("area." + a);
      b.addEventListener("click", function () {
        var p = investAreas.indexOf(a);
        if (p >= 0) investAreas.splice(p, 1); else investAreas.push(a);
        renderReflect();
      });
      grid.appendChild(b);
    });

    $("btn-habits-help").classList.toggle("sel", habits === "help");
    $("btn-habits-hurt").classList.toggle("sel", habits === "hurt");
    $("habits-change-wrap").classList.toggle("hidden", habits !== "hurt");
  }

  $("btn-habits-help").addEventListener("click", function () { habits = "help"; renderReflect(); });
  $("btn-habits-hurt").addEventListener("click", function () { habits = "hurt"; renderReflect(); });
  $("reflect-why").addEventListener("input", function () { reflectWhy = this.value; });
  $("reflect-change").addEventListener("input", function () { habitsChange = this.value; });

  function renderGoals() {
    var list = $("goals-list");
    list.innerHTML = "";
    investAreas.forEach(function (area) {
      goals[area] = goals[area] || {};
      var card = document.createElement("div");
      card.className = "goal-card";
      var fields = ["specific", "measurable", "achievable", "relevant", "timebound"];
      card.innerHTML = "<h3>" + PL.esc(PL.t("area." + area)) + "</h3>" +
        fields.map(function (f) {
          return "<div class='goal-field'><label>" + PL.esc(PL.t("goal." + f)) +
            "<span class='hint'>" + PL.esc(PL.t("goal." + f + ".hint")) + "</span></label>" +
            "<input type='text' data-area='" + area + "' data-field='" + f + "' value='" + PL.esc(goals[area][f] || "") + "'></div>";
        }).join("");
      list.appendChild(card);
    });
    list.querySelectorAll("input").forEach(function (inp) {
      inp.addEventListener("input", function () {
        var a = inp.getAttribute("data-area"), f = inp.getAttribute("data-field");
        goals[a] = goals[a] || {};
        goals[a][f] = inp.value;
      });
    });
  }

  function resetState() {
    scores = {};
    reflectWhy = ""; investAreas = []; habits = ""; habitsChange = ""; goals = {};
  }

  function saveRun() {
    var history = PL.load("lifewheel", []);
    history.push({
      n: history.length + 1,
      date: PL.todayISO(),
      scores: Object.assign({}, scores),
      reflection: { why: reflectWhy, habits: habits, change: habitsChange },
      investAreas: investAreas.slice(),
      goals: JSON.parse(JSON.stringify(goals))
    });
    PL.store("lifewheel", history);
    renderHistory();
  }

  function renderResult() {
    var overall = avgOf(AREAS);
    var sorted = AREAS.slice().sort(function (a, b) { return scores[a] - scores[b]; });
    var lowest = sorted[0];
    $("res-summary").textContent = PL.t("avg.overall") + ": " + fmt1(overall) + "/10 · " +
      PL.t("area." + lowest) + " (" + scores[lowest] + "/10)";
  }

  function historySummaryLine(e) {
    var vals = AREAS.map(function (a) { return e.scores[a]; }).filter(function (v) { return typeof v === "number"; });
    var overall = vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : null;
    return PL.t("hist.overall") + ": " + fmt1(overall) + "/10";
  }

  function renderHistory() {
    var history = PL.load("lifewheel", []);
    var box = $("history-list");
    box.innerHTML = "";
    history.slice().reverse().forEach(function (e) {
      var idx = history.indexOf(e);
      var div = document.createElement("div");
      div.className = "entry";
      div.innerHTML =
        "<div class='entry-head'><span class='entry-date'>#" + e.n + " · " + PL.fmtDate(e.date) + "</span>" +
        "<button class='del' data-del='" + idx + "'>🗑️</button></div>" +
        "<p style='margin:8px 0 0'>" + PL.esc(historySummaryLine(e)) + "</p>";
      box.appendChild(div);
    });
    $("history-empty").classList.toggle("hidden", history.length > 0);
    box.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!confirm(PL.t("del.confirm"))) return;
        var h = PL.load("lifewheel", []);
        h.splice(parseInt(b.getAttribute("data-del"), 10), 1);
        PL.store("lifewheel", h);
        renderHistory();
      });
    });
  }

  function startWheel() {
    resetState();
    show("wheel");
    renderLegend();
    renderWheel();
    renderAverages();
    checkWheelComplete();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("btn-start").addEventListener("click", startWheel);
  $("btn-again").addEventListener("click", startWheel);

  $("btn-wheel-next").addEventListener("click", function () {
    show("reflect");
    renderReflect();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("btn-reflect-next").addEventListener("click", function () {
    if (investAreas.length) {
      show("goals");
      renderGoals();
    } else {
      saveRun();
      renderResult();
      show("result");
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("btn-save").addEventListener("click", function () {
    saveRun();
    renderResult();
    show("result");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.addEventListener("pl:ready", renderHistory);
  PL.onLang(function () {
    renderHistory();
    if (state === "wheel") { renderLegend(); renderWheel(); renderAverages(); }
    if (state === "reflect") renderReflect();
    if (state === "goals") renderGoals();
    if (state === "result") renderResult();
  });
})();
</script>
</body>
</html>
