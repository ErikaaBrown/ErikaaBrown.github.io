<script src="../js/app.js?v=12"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MIN_BUCKET = 5; // dias mínimos em cada grupo para mostrar uma comparação
  var MIN_MOOD_DAYS = 5; // dias mínimos de humor registado para mostrar seja o que for
  var MIN_WEEKDAY_BUCKET = 3; // registos mínimos num dia da semana para o considerar
  var MAX_CARDS = 5; // número máximo de cartões de padrão a mostrar

  function isoDaysAgo(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function last30() {
    var out = [];
    for (var i = 29; i >= 0; i--) out.push(isoDaysAgo(i));
    return out;
  }
  function avg(arr) { return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length; }

  function habitDaySet(habits) {
    var set = {};
    habits.forEach(function (h) {
      Object.keys(h.c || {}).forEach(function (iso) { if (h.c[iso]) set[iso] = true; });
    });
    return set;
  }

  function dateSet(entries, field) {
    var set = {};
    (entries || []).forEach(function (e) { if (e && e[field]) set[e[field]] = true; });
    return set;
  }

  function durationH(bed, wake) {
    var b = bed.split(":"), w = wake.split(":");
    var mins = (parseInt(w[0], 10) * 60 + parseInt(w[1], 10)) - (parseInt(b[0], 10) * 60 + parseInt(b[1], 10));
    if (mins <= 0) mins += 24 * 60;
    return mins / 60;
  }

  function renderConsistency(mood, habits, gratitude, sleep) {
    var days = last30();
    var habitSet = habitDaySet(habits);
    var cMood = days.filter(function (d) { return mood[d]; }).length;
    var cHabits = days.filter(function (d) { return habitSet[d]; }).length;
    var cGrat = days.filter(function (d) { return (gratitude[d] || []).some(Boolean); }).length;
    var cSleep = days.filter(function (d) { return sleep[d]; }).length;
    var tiles = [
      ["c.mood", cMood], ["c.habits", cHabits], ["c.gratitude", cGrat], ["c.sleep", cSleep]
    ];
    $("consistency-tiles").innerHTML = tiles.map(function (t) {
      return "<div class='tile'><div class='num'>" + t[1] + "</div><div class='lbl'>" + PL.t(t[0]) + "</div></div>";
    }).join("");
  }

  function comparison(mood, inGroup) {
    var withA = [], withoutB = [];
    Object.keys(mood).forEach(function (iso) {
      if (inGroup(iso)) withA.push(mood[iso].m); else withoutB.push(mood[iso].m);
    });
    if (withA.length < MIN_BUCKET || withoutB.length < MIN_BUCKET) return null;
    return { a: avg(withA), b: avg(withoutB) };
  }

  function sentenceKey(a, b) {
    var diff = a - b;
    if (diff > 0.25) return "up";
    if (diff < -0.25) return "down";
    return "flat";
  }

  function renderPatterns(mood, habits, gratitude, sleep, thoughts, compassionbreak, selfcarelog) {
    var box = $("patterns-list");
    var tpl = $("tpl-pattern");
    box.innerHTML = "";

    var habitSet = habitDaySet(habits);
    var pHabits = comparison(mood, function (iso) { return !!habitSet[iso]; });

    var pGratitude = comparison(mood, function (iso) { return (gratitude[iso] || []).some(Boolean); });

    var pSleep = null;
    var goodMood = [], poorMood = [];
    Object.keys(mood).forEach(function (iso) {
      var s = sleep[iso];
      if (!s || !s.b || !s.w) return;
      var h = durationH(s.b, s.w);
      if (h >= 7) goodMood.push(mood[iso].m);
      else if (h < 6) poorMood.push(mood[iso].m);
    });
    if (goodMood.length >= MIN_BUCKET && poorMood.length >= MIN_BUCKET) {
      pSleep = { a: avg(goodMood), b: avg(poorMood) };
    }

    var thoughtSet = dateSet(thoughts, "date");
    var pThoughts = comparison(mood, function (iso) { return !!thoughtSet[iso]; });

    var breakSet = dateSet(compassionbreak, "date");
    var pBreak = comparison(mood, function (iso) { return !!breakSet[iso]; });

    var careSet = dateSet(selfcarelog, "added");
    var pCare = comparison(mood, function (iso) { return !!careSet[iso]; });

    var cards = [
      { key: "habits", data: pHabits },
      { key: "gratitude", data: pGratitude },
      { key: "sleep", data: pSleep },
      { key: "thoughts", data: pThoughts },
      { key: "compassionbreak", data: pBreak },
      { key: "selfcarelog", data: pCare }
    ].filter(function (c) { return c.data; });

    // padrões mais fortes primeiro, para cada pessoa ver o que mais se destaca nos seus próprios dados
    cards.sort(function (x, y) { return Math.abs(y.data.a - y.data.b) - Math.abs(x.data.a - x.data.b); });
    cards = cards.slice(0, MAX_CARDS);

    if (!cards.length) {
      box.innerHTML = "<div class='panel panel-soft'><p style='margin:0' data-i18n='empty.p'>" + PL.t("empty.p") + "</p></div>";
      return;
    }

    cards.forEach(function (c) {
      var node = tpl.content.firstElementChild.cloneNode(true);
      node.querySelector(".pattern-title").textContent = PL.t("p." + c.key + ".title");
      node.querySelector(".pattern-num-a").textContent = c.data.a.toFixed(1);
      node.querySelector(".pattern-num-b").textContent = c.data.b.toFixed(1);
      node.querySelector(".pattern-lbl-a").textContent = PL.t("p." + c.key + ".a");
      node.querySelector(".pattern-lbl-b").textContent = PL.t("p." + c.key + ".b");
      var key = sentenceKey(c.data.a, c.data.b);
      node.querySelector(".pattern-sentence").textContent = PL.t("p." + c.key + ".sentence." + key)
        .replace("{a}", c.data.a.toFixed(1)).replace("{b}", c.data.b.toFixed(1));
      box.appendChild(node);
    });
  }

  function renderWeekday(mood) {
    var box = $("weekday-panel");
    var buckets = [[], [], [], [], [], [], []]; // 0=domingo .. 6=sábado
    Object.keys(mood).forEach(function (iso) {
      var wd = new Date(iso + "T00:00:00").getDay();
      buckets[wd].push(mood[iso].m);
    });
    var stats = buckets.map(function (arr, i) {
      return arr.length >= MIN_WEEKDAY_BUCKET ? { wd: i, avg: avg(arr) } : null;
    }).filter(Boolean);

    if (stats.length < 4) { box.innerHTML = ""; return; }

    stats.sort(function (x, y) { return y.avg - x.avg; });
    var best = stats[0], worst = stats[stats.length - 1];
    var sentence;
    if (best.avg - worst.avg < 0.4) {
      sentence = PL.t("weekday.flat");
    } else {
      sentence = PL.t("weekday.both")
        .replace("{best}", PL.t("wd." + best.wd)).replace("{bv}", best.avg.toFixed(1))
        .replace("{worst}", PL.t("wd." + worst.wd)).replace("{wv}", worst.avg.toFixed(1));
    }
    box.innerHTML = "<div class='panel'><h3 style='margin-top:0'>" + PL.t("weekday.title") +
      "</h3><p class='muted' style='margin:0'>" + sentence + "</p></div>";
  }

  function weeklyAverages(mood) {
    var weeks = []; // mais antiga -> mais recente, 8 semanas
    for (var w = 7; w >= 0; w--) {
      var vals = [];
      for (var d = 0; d < 7; d++) {
        var iso = isoDaysAgo(w * 7 + d);
        if (mood[iso]) vals.push(mood[iso].m);
      }
      weeks.push(vals.length ? avg(vals) : null);
    }
    return weeks;
  }

  function sparklineSVG(weeks) {
    var points = [];
    weeks.forEach(function (v, i) { if (v !== null) points.push({ x: i, y: v }); });
    var w = 280, h = 64, pad = 8;
    var xStep = (w - pad * 2) / 7;
    var toY = function (v) { return h - pad - (v - 1) / 4 * (h - pad * 2); };
    var path = points.map(function (p, i) {
      return (i === 0 ? "M" : "L") + (pad + p.x * xStep).toFixed(1) + "," + toY(p.y).toFixed(1);
    }).join(" ");
    var dots = points.map(function (p) {
      return "<circle cx='" + (pad + p.x * xStep).toFixed(1) + "' cy='" + toY(p.y).toFixed(1) + "' r='3' fill='var(--brand)'/>";
    }).join("");
    return "<svg viewBox='0 0 " + w + " " + h + "' width='100%' height='" + h + "' aria-hidden='true'>" +
      "<path d='" + path + "' fill='none' stroke='var(--brand)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>" +
      dots + "</svg>";
  }

  function renderTrend(mood) {
    var box = $("trend-panel");
    var weeks = weeklyAverages(mood);
    var present = [];
    weeks.forEach(function (v, i) { if (v !== null) present.push(v); });
    if (present.length < 4) { box.innerHTML = ""; return; }

    var mid = Math.ceil(present.length / 2);
    var firstHalf = present.slice(0, mid), secondHalf = present.slice(mid);
    var trendKey = "flat";
    if (secondHalf.length && firstHalf.length) {
      var diff = avg(secondHalf) - avg(firstHalf);
      if (diff > 0.3) trendKey = "up";
      else if (diff < -0.3) trendKey = "down";
    }
    box.innerHTML = "<div class='panel'><h3 style='margin-top:0'>" + PL.t("trend.title") +
      "</h3>" + sparklineSVG(weeks) +
      "<p class='muted' style='margin:8px 0 0'>" + PL.t("trend." + trendKey) + "</p></div>";
  }

  function renderAll() {
    var mood = PL.load("mood", {});
    var habits = PL.load("habits", []);
    var gratitude = PL.load("gratitude", {});
    var sleep = PL.load("sleep", {});
    var thoughts = PL.load("thoughts", []);
    var compassionbreak = PL.load("compassionbreak", []);
    var selfcarelog = PL.load("selfcarelog", []);

    var moodDays = Object.keys(mood).length;
    if (moodDays < MIN_MOOD_DAYS) {
      $("panel-empty").classList.remove("hidden");
      $("panel-main").classList.add("hidden");
      return;
    }
    $("panel-empty").classList.add("hidden");
    $("panel-main").classList.remove("hidden");
    renderConsistency(mood, habits, gratitude, sleep);
    renderPatterns(mood, habits, gratitude, sleep, thoughts, compassionbreak, selfcarelog);
    renderWeekday(mood);
    renderTrend(mood);
  }

  document.addEventListener("pl:ready", renderAll);
  PL.onLang(renderAll);
})();
</script>
</body>
</html>
