      <input type="range" id="f-suds" min="0" max="100" value="50" style="flex:1">

    </div>
  </section>

  <section>
    <h2 data-i18n="list.title"></h2>
    <p class="small muted" id="count-line"></p>
    <p class="small muted" data-i18n="list.sortnote"></p>
    <div id="fear-list"></div>
    <p class="small muted hidden" id="list-empty" data-i18n="list.empty"></p>
  </section>
</main>

<div id="site-footer"></div>

<script>
window.PAGE = {
  root: "../",
  section: "tools",
  i18n: {
    pt: {
      "page.title": "Hierarquia de Medos",
      "crumb": "Ferramentas",
      "intro.lead": "Uma ferramenta clássica da terapia de exposição: lista situações que te causam ansiedade, dá-lhes uma nota, e enfrenta-as por ordem, da menos à mais desafiante.",

      "add.title": "Adicionar uma situação",

      "add.ph1": "ex.: Falar com um estranho na rua",
      "add.label2": "Nível de ansiedade que te causa agora (0-100)",
      "btn.add": "Adicionar à lista",
      "added": "Situação adicionada 🌿",
      "empty.req": "Escreve primeiro a situação",
      "list.title": "A tua hierarquia",
      "list.sortnote": "Ordenada automaticamente da menos para a mais ansiogénica.",
      "list.empty": "Ainda não há situações na lista. Junta a primeira em cima.",
      "del.confirm": "Remover esta situação da lista?"
    },
    en: {
      "page.title": "Fear Hierarchy",
      "crumb": "Tools",
      "intro.lead": "A classic exposure-therapy tool: list situations that cause you anxiety, rate them, and face them in order, from the least to the most challenging.",
      "how.p": "💡 How it works: for each situation, write a rating from 0 to 100 (SUDS, \"subjective units of distress\") reflecting how much anxiety it causes you today. The list sorts itself, from easiest to hardest. The idea of gradual exposure is to start with the lowest situations on the list, only moving to the next once the previous one stops feeling so disturbing. This is general self-help: if the anxiety is very disabling, it makes more sense to build this hierarchy with a professional's support.",
      "add.title": "Add a situation",
      "add.label1": "Situation",
      "add.ph1": "e.g.: Talking to a stranger on the street",
      "add.label2": "Anxiety level it causes you right now (0-100)",
      "btn.add": "Add to the list",
      "added": "Situation added 🌿",
      "empty.req": "Write the situation first",
      "list.title": "Your hierarchy",
      "list.sortnote": "Automatically sorted from least to most anxiety-provoking.",

      "del.confirm": "Remove this situation from the list?"

<script src="../js/app.js?v=8"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var fears = PL.load("fears", []);

  function save() { PL.store("fears", fears); }

  function renderCount() {
    $("count-line").textContent = fears.length;
  }

  function renderList() {
    var box = $("fear-list");
    box.innerHTML = "";
    fears.slice().sort(function (a, b) { return a.suds - b.suds; }).forEach(function (f) {
      var idx = fears.indexOf(f);
      var div = document.createElement("div");
      div.className = "entry";
      div.innerHTML =
        "<div class='entry-head'><span class='entry-date'>" + PL.esc(f.situation) + "</span>" +
        "<span class='chip'>" + f.suds + "/100</span>" +
        "<button class='del' data-del='" + idx + "'>🗑️</button></div>";
      box.appendChild(div);
    });
    $("list-empty").classList.toggle("hidden", fears.length > 0);
    document.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (confirm(PL.t("del.confirm"))) {
          fears.splice(parseInt(b.getAttribute("data-del"), 10), 1);
          save();
          renderAll();
        }
      });
    });
  }

  function renderAll() { renderCount(); renderList(); }

  $("f-suds").addEventListener("input", function () {
    $("f-suds-out").textContent = $("f-suds").value;
  });

  $("btn-add").addEventListener("click", function () {
    var situation = $("f-situation").value.trim();
    if (!situation) { PL.toast(PL.t("empty.req")); return; }
    fears.push({ situation: situation, suds: parseInt($("f-suds").value, 10), added: PL.todayISO() });
    save();
    $("f-situation").value = "";
    $("f-suds").value = 50;
    $("f-suds-out").textContent = "50";
    PL.toast(PL.t("added"));
    renderAll();
  });

  document.addEventListener("pl:ready", renderAll);
  PL.onLang(renderAll);
})();
</script>
</body>
</html>
