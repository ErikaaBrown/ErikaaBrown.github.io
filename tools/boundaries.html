<script src="../js/app.js?v=11"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CATS = ["friends", "romantic", "family", "colleagues", "self"];
  var entries = PL.load("boundaries", []);

  function save() { PL.store("boundaries", entries); }

  function renderCats() {
    var sel = $("f-cat");
    var current = sel.value;
    sel.innerHTML = CATS.map(function (c) { return "<option value='" + c + "'>" + PL.esc(PL.t("cat." + c)) + "</option>"; }).join("");
    if (current) sel.value = current;
  }

  function renderCount() {
    $("count-line").textContent = entries.length;
  }

  function renderList() {
    var box = $("entry-list");
    box.innerHTML = "";
    entries.slice().reverse().forEach(function (e) {
      var idx = entries.indexOf(e);
      var div = document.createElement("div");
      div.className = "entry";
      div.innerHTML =
        "<div class='entry-head'><span class='entry-date'>" + PL.esc(PL.t("cat." + e.category)) + " · " + PL.fmtDate(e.added) + "</span>" +
        "<button class='del' data-del='" + idx + "'>🗑️</button></div>" +
        "<p style='margin:8px 0 0'><strong>" + PL.esc(e.text) + "</strong></p>" +
        (e.feeling ? "<p class='small muted' style='margin:4px 0 0'>" + PL.esc(e.feeling) + "</p>" : "") +
        "<div class='center mt-2'><button type='button' class='tag-btn started" + (e.started ? " sel" : "") + "' data-idx='" + idx + "'>" +
        (e.started ? "✅ " + PL.t("started.yes") : "⬜ " + PL.t("started.no")) + "</button></div>";
      box.appendChild(div);
    });
    $("list-empty").classList.toggle("hidden", entries.length > 0);
    box.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (confirm(PL.t("del.confirm"))) {
          entries.splice(parseInt(b.getAttribute("data-del"), 10), 1);
          save();
          renderAll();
        }
      });
    });
    box.querySelectorAll(".started").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-idx"), 10);
        entries[i].started = !entries[i].started;
        save();
        renderList();
      });
    });
  }

  function renderAll() { renderCats(); renderCount(); renderList(); }

  $("btn-add").addEventListener("click", function () {
    var text = $("f-text").value.trim();
    if (!text) { PL.toast(PL.t("empty.req")); return; }
    entries.push({
      category: $("f-cat").value, text: text, feeling: $("f-feeling").value.trim(),
      started: false, added: PL.todayISO()
    });
    save();
    $("f-text").value = "";
    $("f-feeling").value = "";
    PL.toast(PL.t("added"));
    renderAll();
  });

  document.addEventListener("pl:ready", renderAll);
  PL.onLang(renderAll);
})();
</script>
</body>
