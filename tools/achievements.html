<script src="../js/app.js?v=7"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var items = PL.load("achievements", []);
  var size = "medium";
  var SIZES = ["small", "medium", "big"];
  var SIZE_ICON = { small: "🌱", medium: "🌿", big: "🌳" };

  function save() { PL.store("achievements", items); }

  function renderPicker() {
    var box = $("size-picker");
    box.innerHTML = "";
    SIZES.forEach(function (s) {
      var b = document.createElement("button");
      b.className = "opt-btn" + (s === size ? " sel" : "");
      b.style.textAlign = "center";
      b.textContent = SIZE_ICON[s] + " " + PL.t("size." + s);
      b.addEventListener("click", function () { size = s; renderPicker(); });
      box.appendChild(b);
    });
  }

  function weekStart() {
    var d = new Date();
    var day = (d.getDay() + 6) % 7;
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - day);
    return d;
  }

  function renderStats() {
    $("stat-total").textContent = items.length;
    var ws = weekStart();
    var week = items.filter(function (a) { return new Date(a.added) >= ws; }).length;
    $("stat-week").textContent = week;
  }

  function renderList() {
    var box = $("list");
    box.innerHTML = "";
    items.slice().reverse().forEach(function (a) {
      var idx = items.indexOf(a);
      var div = document.createElement("div");
      div.className = "entry";
      div.innerHTML =
        "<div class='entry-head'><span class='entry-date'>" + (SIZE_ICON[a.size] || "🌿") + " " + PL.fmtDate(a.added) + "</span>" +
        "<button class='del' data-del='" + idx + "'>🗑️</button></div>" +
        "<p style='margin:8px 0 0'>" + PL.esc(a.text) + "</p>";
      box.appendChild(div);
    });
    $("list-empty").classList.toggle("hidden", items.length > 0);
    document.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (confirm(PL.t("del.confirm"))) {
          items.splice(parseInt(b.getAttribute("data-del"), 10), 1);
          save();
          renderAll();
        }
      });
    });
  }

  function renderAll() { renderStats(); renderList(); }

  $("btn-add").addEventListener("click", function () {
    var text = $("f-ach").value.trim();
    if (!text) { PL.toast(PL.t("empty.req")); return; }
    items.push({ text: text, size: size, added: PL.todayISO() });
    save();
    $("f-ach").value = "";
    PL.toast(PL.t("added"));
    renderAll();
  });

  document.addEventListener("pl:ready", function () { renderPicker(); renderAll(); });
  PL.onLang(function () { renderPicker(); renderAll(); });
})();
</script>
</body>
</html>
