<script src="../js/app.js?v=11"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var entries = PL.load("decisionbalance", []);

  function save() { PL.store("decisionbalance", entries); }

  function toLines(text) {
    return text.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
  }

  function renderCount() {
    $("count-line").textContent = entries.length;
  }

  function renderList() {
    var box = $("entry-list");
    box.innerHTML = "";
    entries.slice().reverse().forEach(function (e) {
      var idx = entries.indexOf(e);
      var div = document.createElement("div");
      div.className = "entry";
      var prosHtml = e.pros.length ? "<ul style='margin:4px 0;padding-left:20px'>" + e.pros.map(function (p) { return "<li>" + PL.esc(p) + "</li>"; }).join("") + "</ul>" : "";
      var consHtml = e.cons.length ? "<ul style='margin:4px 0;padding-left:20px'>" + e.cons.map(function (c) { return "<li>" + PL.esc(c) + "</li>"; }).join("") + "</ul>" : "";
      div.innerHTML =
        "<div class='entry-head'><span class='entry-date'>" + PL.fmtDate(e.added) + "</span>" +
        "<button class='del' data-del='" + idx + "'>🗑️</button></div>" +
        "<p style='margin:8px 0 0'><strong>" + PL.esc(e.title) + "</strong></p>" +
        "<p class='small muted' style='margin:10px 0 0'><strong>✅ " + PL.t("pros.label") + "</strong></p>" + prosHtml +
        "<p class='small muted' style='margin:10px 0 0'><strong>⚠️ " + PL.t("cons.label") + "</strong></p>" + consHtml +
        (e.conclusion ? "<p class='small' style='margin:10px 0 0'><strong>🧭 " + PL.t("conclusion.label") + ":</strong> " + PL.esc(e.conclusion) + "</p>" : "");
      box.appendChild(div);
    });
    $("list-empty").classList.toggle("hidden", entries.length > 0);
    box.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (confirm(PL.t("del.confirm"))) {
          entries.splice(parseInt(b.getAttribute("data-del"), 10), 1);
          save();
          renderAll();
        }
      });
    });
  }

  function renderAll() { renderCount(); renderList(); }

  $("btn-add").addEventListener("click", function () {
    var title = $("f-title").value.trim();
    if (!title) { PL.toast(PL.t("empty.req")); return; }
    entries.push({
      title: title, pros: toLines($("f-pros").value), cons: toLines($("f-cons").value),
      conclusion: $("f-conclusion").value.trim(), added: PL.todayISO()
    });
    save();
    $("f-title").value = "";
    $("f-pros").value = "";
    $("f-cons").value = "";
    $("f-conclusion").value = "";
    PL.toast(PL.t("added"));
    renderAll();
  });

  document.addEventListener("pl:ready", renderAll);
  PL.onLang(renderAll);
})();
</script>
</body>
